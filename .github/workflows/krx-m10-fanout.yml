name: KRX M10 report fan-out

run-name: KRX M10 fan-out ${{ inputs.krx_generation_id || github.event.client_payload.krx_generation_id || 'missing-generation' }} ${{ inputs.krx_expected_date || github.event.client_payload.krx_expected_date || 'missing-date' }} publish-${{ inputs.publish || github.event.client_payload.publish || 'false' }} ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      krx_expected_date:
        description: Exact KRX trading date in YYYYMMDD form
        required: true
        type: string
      krx_ref:
        description: Immutable private KRX branch or commit SHA
        required: true
        type: string
      krx_generation_id:
        description: Exact KRX generation ID
        required: true
        type: string
      publish:
        description: Forward publish permission to child workflows
        required: false
        default: false
        type: boolean
      dispatch_ref:
        description: Workflow ref for child runs; main for operations, PR branch for isolated validation
        required: false
        default: main
        type: string
  repository_dispatch:
    types: [krx_generation_ready]

permissions:
  contents: read
  actions: write

concurrency:
  group: krx-m10-fanout-${{ inputs.krx_generation_id || github.event.client_payload.krx_generation_id || 'missing-generation' }}-${{ inputs.krx_expected_date || github.event.client_payload.krx_expected_date || 'missing-date' }}-${{ inputs.publish || github.event.client_payload.publish || 'false' }}
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve dispatch request
        id: request
        shell: bash
        env:
          REQUEST_DATE: ${{ inputs.krx_expected_date || github.event.client_payload.krx_expected_date || '' }}
          REQUEST_REF: ${{ inputs.krx_ref || github.event.client_payload.krx_ref || '' }}
          REQUEST_GENERATION: ${{ inputs.krx_generation_id || github.event.client_payload.krx_generation_id || '' }}
          REQUEST_PUBLISH: ${{ inputs.publish || github.event.client_payload.publish || 'false' }}
          REQUEST_DISPATCH_REF: ${{ inputs.dispatch_ref || github.event.client_payload.dispatch_ref || 'main' }}
        run: |
          set -euo pipefail
          test -n "$REQUEST_DATE" || { echo "EXPECTED_DATE_REQUIRED" >&2; exit 2; }
          test -n "$REQUEST_REF" || { echo "KRX_REF_REQUIRED" >&2; exit 2; }
          test -n "$REQUEST_GENERATION" || { echo "GENERATION_ID_REQUIRED" >&2; exit 2; }
          case "$REQUEST_PUBLISH" in
            true|false) ;;
            *) echo "PUBLISH_VALUE_REQUIRED" >&2; exit 2 ;;
          esac
          case "$REQUEST_DATE" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "INVALID_EXPECTED_DATE" >&2; exit 2 ;;
          esac
          case "$REQUEST_REF" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "IMMUTABLE_KRX_REF_REQUIRED" >&2; exit 2 ;;
          esac
          echo "expected_date=$REQUEST_DATE" >> "$GITHUB_OUTPUT"
          echo "krx_ref=$REQUEST_REF" >> "$GITHUB_OUTPUT"
          echo "generation_id=$REQUEST_GENERATION" >> "$GITHUB_OUTPUT"
          echo "publish=$REQUEST_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "dispatch_ref=$REQUEST_DISPATCH_REF" >> "$GITHUB_OUTPUT"
          echo "execution_id=${REQUEST_GENERATION}_${REQUEST_DATE}_${REQUEST_PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify private KRX generation
        id: krx
        uses: ./.github/actions/resolve-krx-generation
        with:
          token: ${{ secrets.KRX_PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.request.outputs.krx_ref }}
          expected-date: ${{ steps.request.outputs.expected_date }}
          generation-id: ${{ steps.request.outputs.generation_id }}
          output-dir: ${{ runner.temp }}/krx-report-input

      - name: Stop duplicate fan-out
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TITLE: KRX M10 fan-out ${{ steps.request.outputs.generation_id }} ${{ steps.request.outputs.expected_date }} publish-${{ steps.request.outputs.publish }} ${{ github.sha }}
          LEGACY_TITLE: KRX M10 fan-out ${{ steps.request.outputs.generation_id }} ${{ steps.request.outputs.expected_date }} ${{ github.sha }}
          PUBLISH_STATE: ${{ steps.request.outputs.publish }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow krx-m10-fanout.yml --limit 50 --json databaseId,displayTitle,status,conclusion)
          existing=$(printf '%s' "$runs" | python3 -c 'import json,os,sys; rows=json.load(sys.stdin); title=os.environ["EXPECTED_TITLE"]; legacy=os.environ["LEGACY_TITLE"]; publish=os.environ["PUBLISH_STATE"]; current=os.environ["CURRENT_RUN"]; matches=[r for r in rows if r.get("databaseId") != int(current) and (r.get("conclusion") == "success" or r.get("status") in {"queued", "in_progress"}) and (str(r.get("displayTitle", "")).startswith(title) or (publish == "false" and str(r.get("displayTitle", "")).startswith(legacy) and " publish-" not in str(r.get("displayTitle", ""))))]; print(matches[0]["databaseId"] if matches else "")')
          if [ -n "$existing" ]; then
            echo "status=NO_CHANGES" >> "$GITHUB_OUTPUT"
            echo "existing_run_id=$existing" >> "$GITHUB_OUTPUT"
            echo "NO_CHANGES: generation already fan-out successfully or is in progress; no child dispatches will be sent."
          else
            echo "status=DISPATCH" >> "$GITHUB_OUTPUT"
            echo "existing_run_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch report workflows
        if: steps.duplicate.outputs.status == 'DISPATCH'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DATE: ${{ steps.request.outputs.expected_date }}
          KRX_REF: ${{ steps.request.outputs.krx_ref }}
          GENERATION_ID: ${{ steps.request.outputs.generation_id }}
          PUBLISH: ${{ steps.request.outputs.publish }}
          DISPATCH_REF: ${{ steps.request.outputs.dispatch_ref }}
        shell: bash
        run: |
          set -euo pipefail
          targets=(refresh.yml refresh-monitoring-daily.yml refresh-market-snapshots.yml refresh-research.yml daily-report.yml)
          : > "$RUNNER_TEMP/krx-fanout-results.jsonl"
          for workflow in "${targets[@]}"; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$DISPATCH_REF" \
              -f krx_expected_date="$EXPECTED_DATE" \
              -f krx_ref="$KRX_REF" \
              -f krx_generation_id="$GENERATION_ID" \
              -f publish="$PUBLISH"
            run_id=""
            for attempt in 1 2 3 4 5 6; do
              sleep 5
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 --json databaseId,displayTitle,status,createdAt)
              run_id=$(printf '%s' "$runs" | python3 -c 'import json,os,sys; rows=json.load(sys.stdin); title="KRX report "+os.environ["GENERATION_ID"]+" "+os.environ["EXPECTED_DATE"]; current=max((r for r in rows if str(r.get("displayTitle", "")).startswith(title)), key=lambda r:r.get("createdAt", ""), default=None); print(current.get("databaseId", "") if current else "")')
              if [ -n "$run_id" ]; then break; fi
            done
            if [ -z "$run_id" ]; then
              echo "::error::Child workflow $workflow did not produce a run ID."
              exit 1
            fi
            if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
              echo "::error::Child workflow $workflow failed: run_id=$run_id"
              exit 1
            fi
            run_json=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion,jobs)
            printf '%s' "$run_json" > "$RUNNER_TEMP/krx-child-run.json"
            PUBLISH_STATE="$PUBLISH" python3 - "$RUNNER_TEMP/krx-child-run.json" <<'PY'
            import json
            import os
            import sys

            payload = json.load(open(sys.argv[1], encoding="utf-8"))
            publish = os.environ["PUBLISH_STATE"]
            steps = [
                step
                for job in (payload.get("jobs") or [])
                for step in (job.get("steps") or [])
            ]
            commits = [step for step in steps if str(step.get("name", "")).startswith("Commit")]
            provenance = [
                step for step in steps
                if "publication provenance" in str(step.get("name", "")).lower()
            ]
            no_publish = [
                step for step in steps
                if step.get("name") == "Report NO_PUBLISH validation result"
            ]

            if payload.get("conclusion") != "success":
                raise SystemExit("CHILD_WORKFLOW_NOT_SUCCESS")
            if publish == "false":
                if any(step.get("conclusion") not in {"skipped", None} for step in commits + provenance):
                    raise SystemExit("PUBLISH_FALSE_COMMIT_STEP_RAN")
                if not any(step.get("conclusion") == "success" for step in no_publish):
                    raise SystemExit("NO_PUBLISH_RESULT_MISSING")
            else:
                if not commits or any(step.get("conclusion") != "success" for step in commits):
                    raise SystemExit("PUBLISH_TRUE_COMMIT_STEP_FAILED")
                if not provenance or any(step.get("conclusion") != "success" for step in provenance):
                    raise SystemExit("PUBLISH_TRUE_PROVENANCE_STEP_FAILED")
          PY
            conclusion=$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion", ""))')
            printf '{"workflow":%s,"runId":%s,"generationId":%s,"targetDate":%s,"publish":%s,"conclusion":%s}\n' \
              "$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$workflow")" \
              "${run_id:-null}" \
              "$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$GENERATION_ID")" \
              "$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$EXPECTED_DATE")" \
              "$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$PUBLISH")" \
              "$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$conclusion")" \
              >> "$RUNNER_TEMP/krx-fanout-results.jsonl"
            echo "Completed $workflow run_id=$run_id conclusion=$conclusion NO_PUBLISH=true"
          done
          echo "results_path=$RUNNER_TEMP/krx-fanout-results.jsonl" >> "$GITHUB_OUTPUT"

      - name: Record fan-out result
        if: always()
        run: |
          {
            echo "## KRX M10 fan-out"
            echo "- generation: ${{ steps.request.outputs.generation_id }}"
            echo "- target date: ${{ steps.request.outputs.expected_date }}"
            echo "- execution id: ${{ steps.request.outputs.execution_id }}"
            echo "- publish: ${{ steps.request.outputs.publish }}"
            echo "- private ref: immutable SHA supplied to resolver"
            echo "- resolver: ${{ steps.krx.outputs.krx_receipt_status || 'BLOCKED' }}"
            echo "- dispatch: ${{ steps.duplicate.outputs.status || 'BLOCKED' }}"
            echo "- duplicate run: ${{ steps.duplicate.outputs.existing_run_id || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fan-out run IDs
        if: steps.dispatch.outputs.results_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: krx-fanout-run-ids-${{ github.run_id }}
          path: ${{ steps.dispatch.outputs.results_path }}
          if-no-files-found: error
          retention-days: 14
