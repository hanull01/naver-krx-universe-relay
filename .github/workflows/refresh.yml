name: Refresh market data

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Refresh mode; final_recovery is only for an explicitly approved recovery run'
        required: false
        default: intraday
        type: choice
        options:
          - intraday
          - final_recovery
  push:
    branches: [main]
    paths:
      - "relay.py"
      - "test_relay.py"
      - "universe_cli.py"
      - "config/universe.json"
      - "config/analysis.json"
      - ".github/workflows/refresh.yml"
permissions:
  contents: write

concurrency:
  # All generated-data commits share main, even when their output paths differ.
  group: generated-data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve refresh mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_MODE: ${{ inputs.run_mode || 'intraday' }}
        shell: bash
        run: |
          final_run=false
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "30 11 * * 1-5" ]; then
            final_run=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$RUN_MODE" = "final_recovery" ]; then
            final_run=true
          fi
          echo "final_run=$final_run" >> "$GITHUB_OUTPUT"
          echo "Resolved refresh mode: event=$EVENT_NAME schedule=${EVENT_SCHEDULE:-none} run_mode=$RUN_MODE final_run=$final_run"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check KRX trading day
        id: market_day
        shell: bash
        run: |
          set +e
          python krx_market_day.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping refresh (closed market or unverifiable KRX calendar)."
          fi
          exit 0

      - name: Run tests
        if: steps.market_day.outputs.run == 'true'
        run: |
          python -m py_compile \
            relay.py test_relay.py krx_market_day.py test_krx_market_day.py \
            tools/naver_full_market_current.py \
            tools/daily_monitoring_baseline.py \
            tools/full_market_monitoring_evidence.py \
            tools/run_full_market_monitoring.py \
            tools/collect_trading_discovery_quotes.py \
            trading_discovery.py test_trading_discovery_quotes.py
          python -m unittest test_relay.py test_krx_market_day.py -v
          python -m unittest \
            test_naver_full_market_current.py \
            test_full_market_monitoring_evidence.py \
            test_daily_monitoring_baseline.py \
            test_monitoring_production.py \
            test_trading_discovery_quotes.py -v

      - name: Sync latest main before collection
        if: steps.market_day.outputs.run == 'true'
        run: |
          target_ref="${GITHUB_REF_NAME:-main}"
          git pull --ff-only origin "$target_ref"

      - name: Collect NAVER data
        id: collect
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          if python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              payload=json.loads(Path('config/universe.json').read_text(encoding='utf-8'))
              codes=[row for row in payload.get('stocks', []) if row.get('enabled', True) and row.get('itemCode')]
          except Exception:
              codes=[1]
          raise SystemExit(0 if not codes else 1)
          PY
          then
            echo "Registered Universe is empty; full-market collection remains independent."
            echo "collection_started_at=$(TZ=Asia/Seoul date --iso-8601=seconds)" >> "$GITHUB_OUTPUT"
            echo "collection_finished_at=$(TZ=Asia/Seoul date --iso-8601=seconds)" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This is the fast intraday path: use cached daily candles and
          # refresh quotes, technicals, states, and group states without daily
          # NAVER API requests.
          started_at=$(TZ=Asia/Seoul date --iso-8601=seconds)
          echo "Collection started at ${started_at}"
          echo "collection_started_at=${started_at}" >> "$GITHUB_OUTPUT"
          python relay.py intraday
          code=$?
          finished_at=$(TZ=Asia/Seoul date --iso-8601=seconds)
          echo "Collection finished at ${finished_at}"
          echo "collection_finished_at=${finished_at}" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect full-market monitoring evidence
        id: full_market
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          target_date=$(TZ=Asia/Seoul date +%Y%m%d)
          last_published_at=$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              payload=json.loads(Path("data/monitoring/latest-quality.json").read_text(encoding="utf-8"))
              print(payload.get("generatedAt") or payload.get("asOfDate") or "UNKNOWN")
          except Exception:
              print("UNKNOWN")
          PY
          )
          echo "last_published_at=${last_published_at}" >> "$GITHUB_OUTPUT"
          readiness=$(python3 - <<'PY'
          import json, sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "tools")
          from run_full_market_monitoring import collection_readiness
          try:
              baseline = json.loads(Path("data/monitoring-baseline/latest.json").read_text(encoding="utf-8"))
          except (OSError, ValueError, json.JSONDecodeError):
              print("BASELINE_UNAVAILABLE")
              raise SystemExit
          now = datetime.now(ZoneInfo("Asia/Seoul"))
          print(collection_readiness(baseline, now)[1])
          PY
          )
          echo "baseline targetDate=${target_date} readiness=${readiness}"
          if [ "$readiness" != "READY" ] && [ "$readiness" != "BASELINE_STALE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "market_status=UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "failure_reason=${readiness}" >> "$GITHUB_OUTPUT"
            echo "Full-market evidence skipped: ${readiness}; preserving prior evidence."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ "$readiness" = "BASELINE_STALE" ]; then
            echo "market_status=AVAILABLE_WITH_BASELINE_WARNING" >> "$GITHUB_OUTPUT"
            echo "::warning::Baseline is stale; collecting a fresh snapshot and preserving the prior baseline until a validated update is published."
          fi
          # The complete NAVER STOCK snapshot is runner-temporary only.  It is
          # collected once, structurally validated by the collector, then
          # reused by evidence and FINAL reconciliation without another API call.
          started_at=$(TZ=Asia/Seoul date --iso-8601=seconds)
          echo "Full-market collection started at ${started_at}"
          echo "collection_started_at=${started_at}" >> "$GITHUB_OUTPUT"
          python tools/naver_full_market_current.py \
            --output "$RUNNER_TEMP/full-market-current.json" \
            --diagnostic "$RUNNER_TEMP/full-market-current-error.json"
          code=$?
          if [ "$code" -eq 0 ]; then
            python tools/run_full_market_monitoring.py \
              --current-file "$RUNNER_TEMP/full-market-current.json" \
              --allow-source-observed-final \
              --source-observed-date "$target_date"
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            python tools/build_dynamic_universe.py
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            echo "market_status=AVAILABLE" >> "$GITHUB_OUTPUT"
            echo "failure_reason=NONE" >> "$GITHUB_OUTPUT"
          else
            reason=$(DIAGNOSTIC_PATH="$RUNNER_TEMP/full-market-current-error.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          try:
              payload=json.loads(Path(os.environ["DIAGNOSTIC_PATH"]).read_text(encoding="utf-8"))
              diagnostics=payload.get("attemptDiagnostics") or []
              errors=[e for item in diagnostics for e in (item.get("errors") or [])]
              reason = errors[0] if errors else payload.get("reconciliationStatus") or payload.get("status") or "FULL_MARKET_FAILURE"
              print(reason.replace("\n", " ")[:180])
          except Exception:
              print("FULL_MARKET_FAILURE")
          PY
            )
            echo "market_status=UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "failure_reason=${reason}" >> "$GITHUB_OUTPUT"
          fi
          finished_at=$(TZ=Asia/Seoul date --iso-8601=seconds)
          echo "Full-market collection finished at ${finished_at}"
          echo "collection_finished_at=${finished_at}" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect market indices
        id: indices
        if: steps.market_day.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          started_at=$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="microseconds"))')
          echo "collection_started_at=${started_at}" >> "$GITHUB_OUTPUT"
          set +e
          python market_indices.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          finished_at=$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="microseconds"))')
          echo "collection_finished_at=${finished_at}" >> "$GITHUB_OUTPUT"

      - name: Diagnose final daily-bar evidence
        id: final_daily_evidence
        if: steps.market_day.outputs.run == 'true' && steps.full_market.outputs.exit_code == '0' && steps.full_market.outputs.ready == 'true' && steps.indices.outputs.exit_code == '0' && steps.mode.outputs.final_run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          # Reuse the validated runner-temporary snapshot; never refetch quotes.
          python tools/final_daily_evidence.py \
            --snapshot "$RUNNER_TEMP/full-market-current.json" \
            --baseline data/monitoring-baseline/latest.json

      - name: Prepare final daily monitoring update (disabled by default)
        id: final_daily_history
        if: steps.market_day.outputs.run == 'true' && steps.full_market.outputs.exit_code == '0' && steps.full_market.outputs.ready == 'true' && steps.indices.outputs.exit_code == '0' && steps.mode.outputs.final_run == 'true' && vars.FINAL_DAILY_HISTORY_WRITE == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/full-market-current.json" "$RUNNER_TEMP/final-daily-target.txt" \
            "${{ steps.indices.outputs.collection_started_at }}" \
            "${{ steps.indices.outputs.collection_finished_at }}" <<'PY'
          import json, sys
          from pathlib import Path
          from market_indices import validate_final_payload
          from tools.final_daily_evidence import validate_snapshot

          snapshot = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          indices = json.loads(Path("data/market/indices.json").read_text(encoding="utf-8"))
          observed_stocks = snapshot.get("stocks") or []
          if (snapshot.get("status") not in {"SUCCESS", "COMPLETE_RECONCILIATION_PENDING"}
                  or snapshot.get("collectionStatus", "SUCCESS") != "SUCCESS"):
              raise SystemExit("FINAL_DAILY_HISTORY_NOT_READY:OBSERVED_STOCK_SNAPSHOT_INVALID")
          expected = [str(row.get("code") or "") for row in observed_stocks]
          if (len(expected) != len(observed_stocks) or len(expected) != len(set(expected))
                  or not expected or any(str(row.get("assetType") or "").upper() != "STOCK"
                                         for row in observed_stocks)):
              raise SystemExit("FINAL_DAILY_HISTORY_NOT_READY:OBSERVED_STOCK_UNIVERSE_INVALID")

          try:
              index_evidence = validate_final_payload(
                  indices, sys.argv[3], sys.argv[4])
          except ValueError as exc:
              raise SystemExit("FINAL_DAILY_HISTORY_NOT_READY:" + str(exc))
          target_date = index_evidence["targetDate"]

          final_evidence = validate_snapshot(
              snapshot, json.loads(Path("data/monitoring-baseline/latest.json").read_text(encoding="utf-8")),
              target_date=target_date, expected_codes=expected)
          print(json.dumps({"finalDailyEvidence": final_evidence}, ensure_ascii=False))
          if not final_evidence["finalEligible"]:
              raise SystemExit("FINAL_DAILY_HISTORY_NOT_READY:FINAL_DAILY_EVIDENCE_UNUSABLE:" +
                               ",".join(final_evidence["errors"]))

          Path(sys.argv[2]).write_text(target_date, encoding="utf-8")
          print(json.dumps({"status": "READY", "targetDate": target_date,
                            "observedCodes": len(expected)}, ensure_ascii=False))
          PY
          python tools/build_monitoring_daily_state.py update-latest \
            --date "$(cat "$RUNNER_TEMP/final-daily-target.txt")" \
            --observed-snapshot "$RUNNER_TEMP/full-market-current.json" \
            --refresh-universe --fetch-today --allow-source-observed \
            --session-diagnostic-output "$RUNNER_TEMP/trading-session-diagnostic.json" \
            > "$RUNNER_TEMP/final-daily-monitoring-result.json"
          cat "$RUNNER_TEMP/final-daily-monitoring-result.json"
          final_status=$(tail -n 1 "$RUNNER_TEMP/final-daily-monitoring-result.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "FAILED"))')
          echo "FINAL_DAILY_STATUS=$final_status"
          test "$final_status" = "SUCCESS"
          diagnostic_path="$RUNNER_TEMP/trading-session-diagnostic.json"
          if [ ! -f "$diagnostic_path" ]; then
            diagnostic_path=data/monitoring-daily/trading-session-diagnostic.json
          fi
          target_date=$(python3 - "$diagnostic_path" "$RUNNER_TEMP/full-market-current.json" <<'PY'
          import json, sys
          from pathlib import Path
          diagnostic = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          snapshot = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected = {str(row.get("code") or "") for row in snapshot.get("stocks") or []}
          if diagnostic.get("status") == "VERIFIED":
              if (set(diagnostic.get("expectedCodes") or []) != expected
                      or set(diagnostic.get("observedCodes") or []) != expected
                      or diagnostic.get("missingCodes")
                      or diagnostic.get("unexpectedCodes")
                      or diagnostic.get("duplicateCodes")
                      or diagnostic.get("mismatchCodes")
                      or diagnostic.get("dateMismatchCodes")):
                  raise SystemExit("TRADING_DATE_DIAGNOSTIC_CODE_SET_UNVERIFIED")
          elif diagnostic.get("status") == "SOURCE_OBSERVED":
              missing = set(diagnostic.get("missingCodes") or [])
              source_missing = set(diagnostic.get("sourceMissingCodes") or [])
              reasons = diagnostic.get("sourceMissingReasons") or {}
              if (set(diagnostic.get("expectedCodes") or []) != expected
                      or not source_missing.issubset(expected)
                      or missing != source_missing
                      or set(diagnostic.get("observedCodes") or []) != expected - source_missing
                      or diagnostic.get("unexpectedCodes")
                      or diagnostic.get("duplicateCodes")
                      or diagnostic.get("mismatchCodes")
                      or diagnostic.get("dateMismatchCodes")
                      or set(reasons) != source_missing
                      or any(value != "NORMAL_EMPTY_DAILY" for value in reasons.values())):
                  raise SystemExit("TRADING_DATE_DIAGNOSTIC_SOURCE_OBSERVED_UNSAFE")
          else:
              raise SystemExit("TRADING_DATE_DIAGNOSTIC_UNVERIFIED")
          print(str(diagnostic.get("targetDate") or "").replace("-", ""))
          PY
          )
          test "$target_date" = "$(cat "$RUNNER_TEMP/final-daily-target.txt")"
          cp "$diagnostic_path" data/monitoring-daily/trading-session-diagnostic.json
          # FINAL is now part of the date-evidence path.  Rebuild the compact
          # full-market artifacts from the already validated runner snapshot
          # so latest-summary.json observes the just-published FINAL state.
          # This intentionally makes no additional NAVER request.
          python tools/run_full_market_monitoring.py \
            --current-file "$RUNNER_TEMP/full-market-current.json" \
            --allow-source-observed-final \
            --source-observed-date "$target_date"
          # FINAL/Baseline now represents the same target date.  Reuse the
          # generated full-market artifacts and rebuild V1 before V2 observes
          # them; this adds no NAVER request.
          python tools/build_dynamic_universe.py
          echo "write=true" >> "$GITHUB_OUTPUT"

      - name: Run V2 shadow observation
        id: v2_shadow
        if: steps.market_day.outputs.run == 'true' && steps.full_market.outputs.exit_code == '0' && steps.full_market.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          # V2 reads the already-generated monitoring snapshot.  Its runner
          # catches its own errors and never gates V1 or MARKET_DATA_READY.
          python tools/run_dynamic_universe_v2_shadow.py
          echo "status=$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('data/dynamic-universe/v2-shadow-run-status.json').read_text()).get('status','FAILED'))
          except Exception:
              print('FAILED')
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Build canonical market report contract
        id: report_contract
        if: steps.full_market.outputs.ready == 'true'
        shell: bash
        run: |
          set +e
          python -m tools.build_report_contract
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "exit_code=$code" >> "$GITHUB_OUTPUT"
            printf '{"status":"FAILED","runId":"%s","tradingDate":"%s","reason":"REPORT_CONTRACT_GENERATION_FAILED"}\n' \
              "$GITHUB_RUN_ID" "$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('data/monitoring/latest-quality.json').read_text()).get('tradingDate') or '')
          except Exception:
              print('')
          PY
          )" > "$RUNNER_TEMP/report-contract-diagnostic.json"
            echo "::warning::Report contract generation failed; preserving the previous contract and continuing with independently validated market publication."
          fi
          exit 0

      - name: Upload report contract diagnostic
        if: steps.report_contract.outputs.status == 'FAILED'
        uses: actions/upload-artifact@v4
        with:
          name: report-contract-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/report-contract-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Collect optional Kiwoom discovery quotes
        id: discovery_quotes
        if: steps.market_day.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          python tools/collect_trading_discovery_quotes.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::Kiwoom supplemental quote collection failed; core market publication and MARKET_DATA_READY remain eligible."
          fi
          exit 0

      - name: Preserve full-market failure diagnostic
        if: steps.market_day.outputs.run == 'true' && steps.full_market.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: full-market-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/full-market-current-error.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit refreshed production data
        id: publish
        if: steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # relay.py owns these Universe-core outputs.  In particular, it does
          # not own data/market, data/research, or data/reports.
          git add \
            data/quotes.json data/quotes-lite.json \
            data/core33.json data/core33-lite.json \
            data/groups \
            data/technicals.json data/technicals-lite.json \
            data/states.json data/states-lite.json \
            data/group-states.json data/group-states-lite.json

          if [ "${{ steps.indices.outputs.exit_code }}" = "0" ]; then
            git add data/market/indices.json
          else
            echo "Market index snapshot unavailable; preserving prior snapshot."
          fi

          final_daily_gate_required=false
          if [ "${{ vars.FINAL_DAILY_HISTORY_WRITE }}" = "true" ] \
            && [ "${{ steps.mode.outputs.final_run }}" = "true" ] \
            && [ "${{ steps.final_daily_history.outcome }}" != "success" ]; then
            final_daily_gate_required=true
          fi

          if [ "${{ steps.full_market.outputs.ready }}" = "true" ] \
            && [ "${{ steps.full_market.outputs.exit_code }}" = "0" ] \
            && [ "$final_daily_gate_required" = "false" ]; then
            git add \
              data/monitoring/latest-breadth.json \
              data/monitoring/latest-stock-signals.json \
              data/monitoring/latest-theme-signals.json \
              data/monitoring/latest-industries.json \
              data/monitoring/latest-leaders.json \
              data/monitoring/latest-changes.json \
              data/monitoring/latest-quality.json \
              data/monitoring/latest-summary.json \
              data/dynamic-universe/latest.json \
              data/dynamic-universe/history.json
            if [ "${{ steps.report_contract.outputs.status }}" = "SUCCESS" ] \
              && [ -f data/monitoring/latest-report-contract.json ]; then
              git add data/monitoring/latest-report-contract.json
            else
              echo "Report contract unavailable; preserving the previous contract artifact."
            fi
          else
            echo "Evidence files are not eligible for publish; preserving prior evidence. Core 42-stock data remains publishable."
          fi

          if [ "${{ vars.FINAL_DAILY_HISTORY_WRITE }}" = "true" ] \
            && [ "${{ steps.mode.outputs.final_run }}" = "true" ] \
            && [ "${{ steps.final_daily_history.outcome }}" = "success" ]; then
            git add \
              data/market-universe/all-assets.json \
              data/monitoring-daily/kospi.json \
              data/monitoring-daily/kosdaq.json \
              data/monitoring-daily/retired.json \
              data/monitoring-daily/universe-lifecycle.json \
              data/monitoring-baseline/latest.json \
              data/monitoring-daily/trading-session-diagnostic.json
          else
            echo "Final daily history not eligible for publish; preserving prior monitoring-daily files."
          fi

          if [ "${{ steps.discovery_quotes.outputs.exit_code }}" = "0" ]; then
            git add -- data/trading-discovery/quotes
          else
            echo "Kiwoom supplemental quotes are not eligible for this market commit; preserving prior files."
          fi

          if [ -f data/dynamic-universe/v2-shadow-run-status.json ]; then
            git add -- data/dynamic-universe/v2-shadow-run-status.json
            if [ "$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('data/dynamic-universe/v2-shadow-run-status.json').read_text()).get('status'))
          except Exception:
              print('FAILED')
          PY
          )" = "OK" ]; then
              git add -- data/dynamic-universe/v2-shadow-latest.json data/dynamic-universe/v2-shadow-history.json
            else
              echo "V2 shadow failed; publishing only its run status and preserving prior V2 result/history."
            fi
          fi

          if git diff --cached --quiet; then
            echo "No data changes to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "publication_usable=true" >> "$GITHUB_OUTPUT"
            echo "publication_changed=false" >> "$GITHUB_OUTPUT"
            echo "production_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh NAVER market data"
            if [ "$final_daily_gate_required" = "true" ]; then
              echo "Final daily update failed; restoring only its generated production paths before synchronization."
              restore_generated_path() {
                path="$1"
                if git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
                  git restore --source=HEAD --worktree -- "$path"
                elif [ -e "$path" ]; then
                  rm -f -- "$path"
                fi
              }
              for path in \
                data/market-universe/all-assets.json \
                data/monitoring-daily/kospi.json \
                data/monitoring-daily/kosdaq.json \
                data/monitoring-daily/retired.json \
                data/monitoring-daily/universe-lifecycle.json \
                data/monitoring-daily/trading-session-diagnostic.json \
                data/monitoring-baseline/latest.json \
                data/dynamic-universe/latest.json \
                data/monitoring/latest-breadth.json \
                data/monitoring/latest-changes.json \
                data/monitoring/latest-industries.json \
                data/monitoring/latest-leaders.json \
                data/monitoring/latest-quality.json \
                data/monitoring/latest-stock-signals.json \
                data/monitoring/latest-summary.json \
                data/monitoring/latest-theme-signals.json; do
                restore_generated_path "$path"
              done
            fi
            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              echo "::error::Unexpected unstaged or untracked files remain before data synchronization; preserving production data."
              git status --short
              exit 1
            fi
            echo "Market data collection succeeded; synchronizing its data commit."
            for attempt in 1 2 3; do
              echo "Push synchronization attempt ${attempt}/3"
              target_ref="${GITHUB_REF_NAME:-main}"
              git fetch origin "$target_ref"
              if ! git rebase "origin/${target_ref}"; then
                echo "::error::Data commit conflicts with newer main. No automatic conflict resolution or force push was attempted."
                git rebase --abort || true
                exit 1
              fi
              target_ref="${GITHUB_REF_NAME:-main}"
              if git push origin "HEAD:${target_ref}"; then
                echo "Market data push succeeded."
                echo "published=true" >> "$GITHUB_OUTPUT"
                echo "publication_usable=true" >> "$GITHUB_OUTPUT"
                echo "publication_changed=true" >> "$GITHUB_OUTPUT"
                echo "production_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Push was rejected because main advanced; retrying with latest main."
            done
            echo "::error::Data collection succeeded, but push was rejected after 3 attempts."
            exit 1
          fi

      - name: Record production publication provenance
        if: steps.publish.outputs.production_commit_sha != ''
        shell: bash
        env:
          PRODUCTION_COMMIT_SHA: ${{ steps.publish.outputs.production_commit_sha }}
          PUBLICATION_CHANGED: ${{ steps.publish.outputs.publication_changed }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"], "production-publication.json").write_text(json.dumps({
              "runId": os.environ["GITHUB_RUN_ID"],
              "headSha": os.environ["GITHUB_SHA"],
              "productionCommitSha": os.environ["PRODUCTION_COMMIT_SHA"],
              "publicationChanged": os.environ["PUBLICATION_CHANGED"] == "true",
          }, ensure_ascii=False, sort_keys=True), encoding="utf-8")
          PY

      - name: Upload production publication provenance
        if: steps.publish.outputs.production_commit_sha != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-publication-${{ github.run_id }}-${{ steps.publish.outputs.production_commit_sha }}-${{ steps.publish.outputs.publication_changed }}
          path: ${{ runner.temp }}/production-publication.json
          if-no-files-found: error
          retention-days: 14

      - name: Send MARKET_DATA_READY signal
        id: ready_email
        if: github.ref == 'refs/heads/main' && steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code == '0' && steps.full_market.outputs.exit_code == '0' && steps.full_market.outputs.ready == 'true' && steps.publish.outputs.publication_changed == 'true' && (steps.publish.outputs.publication_usable == 'true' || steps.publish.outputs.published == 'true')
        continue-on-error: true
        env:
          MARKET_GMAIL_USERNAME: ${{ secrets.MARKET_GMAIL_USERNAME }}
          MARKET_GMAIL_APP_PASSWORD: ${{ secrets.MARKET_GMAIL_APP_PASSWORD }}
          MARKET_GMAIL_TO: ${{ secrets.MARKET_GMAIL_TO }}
          MARKET_DATA_COMMIT_SHA: ${{ steps.publish.outputs.production_commit_sha }}
          MARKET_DATA_PUBLICATION_CHANGED: ${{ steps.publish.outputs.publication_changed }}
          MARKET_DATA_COLLECTION_STARTED_AT: ${{ steps.collect.outputs.collection_started_at }}
          MARKET_DATA_COLLECTION_FINISHED_AT: ${{ steps.collect.outputs.collection_finished_at }}
          FULL_MARKET_STATUS: ${{ steps.full_market.outputs.market_status }}
          FULL_MARKET_FAILURE_REASON: ${{ steps.full_market.outputs.failure_reason }}
          FULL_MARKET_LAST_PUBLISHED_AT: ${{ steps.full_market.outputs.last_published_at }}
          FULL_MARKET_REQUIRED: 'true'
        run: python send_market_data_ready.py

      - name: Warn when MARKET_DATA_READY signal fails
        if: steps.ready_email.outcome == 'failure'
        run: echo "::warning::MARKET_DATA_READY email was not sent; market data publication remains successful."

      - name: Commit collector diagnostic only
        if: steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code != '0' && steps.full_market.outputs.exit_code != '0' && hashFiles('data/status/quotes-error.json') != ''
        shell: bash
        run: |
          echo "Collector failed; preserving last successful production snapshot."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/status/quotes-error.json
          if git diff --cached --quiet; then
            echo "No new collector diagnostic to commit"
            exit 0
          fi
          git commit -m "Record NAVER quote collection failure"
          target_ref="${GITHUB_REF_NAME:-main}"
          git fetch origin "$target_ref"
          if ! git rebase "origin/${target_ref}"; then
            echo "::error::Diagnostic commit conflicts with newer main. No automatic conflict resolution or force push was attempted."
            git rebase --abort || true
            exit 1
          fi
          target_ref="${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${target_ref}"

      - name: Fail after preserving production snapshot
        if: steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code != '0' && steps.full_market.outputs.exit_code != '0'
        run: |
          echo "Collector failed; preserving last successful production snapshot."
          exit 1

      - name: Fail after preserving production snapshot on evidence error
        if: steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code == '0' && steps.full_market.outputs.exit_code != '0'
        run: |
          echo "Full-market evidence failed; core 42-stock publication and MARKET_DATA_READY remain eligible."
