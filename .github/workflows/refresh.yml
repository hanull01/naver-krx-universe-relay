name: Refresh market data

run-name: KRX report ${{ inputs.krx_generation_id || 'missing-generation' }} ${{ inputs.krx_expected_date || 'missing-date' }}

on:
  workflow_dispatch:
    inputs:
      krx_expected_date:
        description: Expected KRX generation trading date (YYYYMMDD); required for an exact-date operational run
        required: false
        type: string
      krx_ref:
        description: Immutable private KRX branch or commit SHA
        required: false
        default: codex/krx-private-sync
        type: string
      krx_generation_id:
        description: Expected immutable KRX generation ID
        required: false
        type: string
      publish:
        description: Publish generated data to main; false performs validation only
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "relay.py"
      - "test_relay.py"
      - "universe_cli.py"
      - "config/universe.json"
      - "config/analysis.json"
      - ".github/workflows/refresh.yml"
permissions:
  contents: write

concurrency:
  # All generated-data commits share main, even when their output paths differ.
  group: generated-data-write
  cancel-in-progress: false

jobs:
  push-event-noop:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for calendar-only gate
        uses: actions/checkout@v4

      - name: Check KRX trading day (NOOP only)
        shell: bash
        run: |
          set +e
          python3 krx_market_day.py
          code=$?
          if [ "$code" -eq 0 ]; then
            calendar_status=OPEN
          else
            calendar_status=CLOSED_OR_UNVERIFIED
          fi
          echo "KRX calendar check: ${calendar_status}; push event remains NOOP."
          echo "KRX calendar check: ${calendar_status}; push event remains NOOP." >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Report push event NOOP
        shell: bash
        run: |
          echo "NOOP_PUSH_EVENT"
          echo "No market data collection or publication was performed."
          {
            echo "## Push event"
            echo
            echo "NOOP_PUSH_EVENT"
            echo "No market data collection or publication was performed."
          } >> "$GITHUB_STEP_SUMMARY"

  refresh:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check KRX trading day
        id: market_day
        shell: bash
        run: |
          set +e
          python krx_market_day.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping refresh (closed market or unverifiable KRX calendar)."
          fi
          exit 0

      - name: Run tests
        if: steps.market_day.outputs.run == 'true'
        run: |
          python -m py_compile \
            relay.py test_relay.py krx_market_day.py test_krx_market_day.py \
            tools/naver_full_market_current.py \
            tools/daily_monitoring_baseline.py \
            tools/full_market_monitoring_evidence.py \
            tools/run_full_market_monitoring.py \
            tools/collect_trading_discovery_quotes.py \
            tools/derived_input_resolver.py \
            trading_discovery.py test_trading_discovery_quotes.py
          python -m unittest test_relay.py test_krx_market_day.py -v
          python -m unittest \
            test_naver_full_market_current.py \
            test_full_market_monitoring_evidence.py \
            test_daily_monitoring_baseline.py \
            test_monitoring_production.py \
            test_trading_discovery_quotes.py -v

      - name: Resolve approved KRX generation
        id: krx
        if: steps.market_day.outputs.run == 'true'
        uses: ./.github/actions/resolve-krx-generation
        with:
          token: ${{ secrets.KRX_PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.krx_ref || 'codex/krx-private-sync' }}
          expected-date: ${{ inputs.krx_expected_date || '' }}
          generation-id: ${{ inputs.krx_generation_id || '' }}
          output-dir: ${{ runner.temp }}/krx-report-input

      - name: Sync latest main before collection
        if: steps.market_day.outputs.run == 'true'
        run: |
          target_ref="${GITHUB_REF_NAME:-main}"
          git pull --ff-only origin "$target_ref"

      - name: Validate KRX report input contract
        if: steps.market_day.outputs.run == 'true'
        env:
          KRX_INPUT_DIR: ${{ steps.krx.outputs.krx_report_input_dir }}
          KRX_GENERATION_ID: ${{ steps.krx.outputs.krx_generation_id }}
          KRX_TARGET_DATE: ${{ steps.krx.outputs.krx_target_date }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["KRX_INPUT_DIR"])
          required = ("technicals.json", "states.json", "group-states.json", "report-contract-projection.json", "krx-resolution.json")
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("KRX_INPUT_UNAVAILABLE:" + ",".join(missing))
          resolution = json.loads((root / "krx-resolution.json").read_text(encoding="utf-8"))
          if resolution.get("receiptStatus") != "VERIFIED":
              raise SystemExit("KRX_INPUT_UNAVAILABLE:receipt")
          if resolution.get("sourceGeneration") != os.environ["KRX_GENERATION_ID"]:
              raise SystemExit("KRX_INPUT_UNAVAILABLE:generation")
          if resolution.get("targetDate") != os.environ["KRX_TARGET_DATE"]:
              raise SystemExit("KRX_INPUT_UNAVAILABLE:date")
          print("KRX_INPUT=AVAILABLE historicalSource=KRX fallbackUsed=false")
          PY

      - name: Collect NAVER data
        id: collect
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          if python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              payload=json.loads(Path('config/universe.json').read_text(encoding='utf-8'))
              codes=[row for row in payload.get('stocks', []) if row.get('enabled', True) and row.get('itemCode')]
          except Exception:
              codes=[1]
          raise SystemExit(0 if not codes else 1)
          PY
          then
            echo "Registered Universe is empty; full-market collection remains independent."
            echo "collection_started_at=$(TZ=Asia/Seoul date --iso-8601=seconds)" >> "$GITHUB_OUTPUT"
            echo "collection_finished_at=$(TZ=Asia/Seoul date --iso-8601=seconds)" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This is the fast intraday path: use cached daily candles and
          # refresh quotes, technicals, states, and group states without daily
          # NAVER API requests.
          started_at=$(TZ=Asia/Seoul date --iso-8601=seconds)
          echo "Collection started at ${started_at}"
          echo "collection_started_at=${started_at}" >> "$GITHUB_OUTPUT"
          python relay.py intraday \
            --krx-input-dir "${{ steps.krx.outputs.krx_report_input_dir }}"
          code=$?
          finished_at=$(TZ=Asia/Seoul date --iso-8601=seconds)
          echo "Collection finished at ${finished_at}"
          echo "collection_finished_at=${finished_at}" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::error::Intraday collection or derived technical validation failed; no publication or MARKET_DATA_READY is eligible."
            exit "$code"
          fi
          exit 0

      - name: Collect full-market monitoring evidence
        id: full_market
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          target_date=$(TZ=Asia/Seoul date +%Y%m%d)
          last_published_at=$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              payload=json.loads(Path("data/monitoring/latest-quality.json").read_text(encoding="utf-8"))
              print(payload.get("generatedAt") or payload.get("asOfDate") or "UNKNOWN")
          except Exception:
              print("UNKNOWN")
          PY
          )
          echo "last_published_at=${last_published_at}" >> "$GITHUB_OUTPUT"
          readiness=$(python3 - <<'PY'
          import json, sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "tools")
          from run_full_market_monitoring import collection_readiness
          try:
              baseline = json.loads(Path("data/monitoring-baseline/latest.json").read_text(encoding="utf-8"))
          except (OSError, ValueError, json.JSONDecodeError):
              print("KRX_PRIMARY_NO_BASELINE")
              raise SystemExit
          now = datetime.now(ZoneInfo("Asia/Seoul"))
          print(collection_readiness(baseline, now)[1])
          PY
          )
          echo "baseline targetDate=${target_date} readiness=${readiness}"
          if [ "$readiness" != "READY" ] && [ "$readiness" != "BASELINE_STALE" ] && [ "$readiness" != "KRX_PRIMARY_NO_BASELINE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "market_status=UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "failure_reason=${readiness}" >> "$GITHUB_OUTPUT"
            echo "Full-market evidence skipped: ${readiness}; preserving prior evidence."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ "$readiness" = "BASELINE_STALE" ]; then
            echo "market_status=AVAILABLE_WITH_BASELINE_WARNING" >> "$GITHUB_OUTPUT"
            echo "::warning::Baseline is stale; collecting a fresh snapshot and preserving the prior baseline until a validated update is published."
          fi
          # The complete NAVER STOCK snapshot is runner-temporary only.  It is
          # collected once, structurally validated by the collector, then
          # reused by the intraday evidence path without another API call.
          started_at=$(TZ=Asia/Seoul date --iso-8601=seconds)
          echo "Full-market collection started at ${started_at}"
          echo "collection_started_at=${started_at}" >> "$GITHUB_OUTPUT"
          python tools/naver_full_market_current.py \
            --output "$RUNNER_TEMP/full-market-current.json" \
            --diagnostic "$RUNNER_TEMP/full-market-current-error.json"
          code=$?
          if [ "$code" -eq 0 ]; then
            python tools/run_full_market_monitoring.py \
              --current-file "$RUNNER_TEMP/full-market-current.json" \
              --krx-resolution "${{ steps.krx.outputs.krx_metadata_path }}" \
              --krx-input-dir "${{ steps.krx.outputs.krx_report_input_dir }}"
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            python tools/build_dynamic_universe.py
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            echo "market_status=AVAILABLE" >> "$GITHUB_OUTPUT"
            echo "failure_reason=NONE" >> "$GITHUB_OUTPUT"
          else
            reason=$(DIAGNOSTIC_PATH="$RUNNER_TEMP/full-market-current-error.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          try:
              payload=json.loads(Path(os.environ["DIAGNOSTIC_PATH"]).read_text(encoding="utf-8"))
              diagnostics=payload.get("attemptDiagnostics") or []
              errors=[e for item in diagnostics for e in (item.get("errors") or [])]
              reason = errors[0] if errors else payload.get("reconciliationStatus") or payload.get("status") or "FULL_MARKET_FAILURE"
              print(reason.replace("\n", " ")[:180])
          except Exception:
              print("FULL_MARKET_FAILURE")
          PY
            )
            echo "market_status=UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "failure_reason=${reason}" >> "$GITHUB_OUTPUT"
          fi
          finished_at=$(TZ=Asia/Seoul date --iso-8601=seconds)
          echo "Full-market collection finished at ${finished_at}"
          echo "collection_finished_at=${finished_at}" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect market indices
        id: indices
        if: steps.market_day.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          started_at=$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="microseconds"))')
          echo "collection_started_at=${started_at}" >> "$GITHUB_OUTPUT"
          set +e
          python market_indices.py
          index_exit_code=$?
          echo "exit_code=$index_exit_code" >> "$GITHUB_OUTPUT"
          finished_at=$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="microseconds"))')
          echo "collection_finished_at=${finished_at}" >> "$GITHUB_OUTPUT"
          if [ "$index_exit_code" -eq 0 ]; then
            echo "final_date_evidence_status=INTRADAY_INDEX_SNAPSHOT" >> "$GITHUB_OUTPUT"
            echo "target_date=$(TZ=Asia/Seoul date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          else
            echo "final_date_evidence_status=UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "target_date=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run V2 shadow observation
        id: v2_shadow
        if: steps.market_day.outputs.run == 'true' && steps.full_market.outputs.exit_code == '0' && steps.full_market.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          # V2 reads the already-generated monitoring snapshot.  Its runner
          # catches its own errors and never gates V1 or MARKET_DATA_READY.
          python tools/run_dynamic_universe_v2_shadow.py
          echo "status=$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('data/dynamic-universe/v2-shadow-run-status.json').read_text()).get('status','FAILED'))
          except Exception:
              print('FAILED')
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Build canonical market report contract
        id: report_contract
        if: steps.full_market.outputs.ready == 'true'
        shell: bash
        run: |
          set +e
          python -m tools.build_report_contract \
            --staging-input-dir "${{ steps.krx.outputs.krx_report_input_dir }}"
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "exit_code=$code" >> "$GITHUB_OUTPUT"
            printf '{"status":"FAILED","runId":"%s","tradingDate":"%s","reason":"REPORT_CONTRACT_GENERATION_FAILED"}\n' \
              "$GITHUB_RUN_ID" "$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('data/monitoring/latest-quality.json').read_text()).get('tradingDate') or '')
          except Exception:
              print('')
          PY
          )" > "$RUNNER_TEMP/report-contract-diagnostic.json"
          echo "::error::Report contract generation failed; no report or market publication is eligible."
          exit "$code"
          fi
          exit 0

      - name: Upload report contract diagnostic
        if: always() && steps.report_contract.outputs.status == 'FAILED'
        uses: actions/upload-artifact@v4
        with:
          name: report-contract-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/report-contract-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Build current observation Markdown and HTML
        id: observation_report
        if: steps.full_market.outputs.exit_code == '0' && steps.full_market.outputs.ready == 'true' && steps.report_contract.outputs.status == 'SUCCESS'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          output_dir="data/reports/current-observation/${GITHUB_RUN_ID}"
          python -m tools.render_current_observation \
            --contract data/monitoring/latest-report-contract.json \
            --output-dir "$output_dir" \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$GITHUB_SHA" \
            > "$RUNNER_TEMP/current-observation-result.json"
          code=$?
          cat "$RUNNER_TEMP/current-observation-result.json"
          if [ "$code" -eq 0 ]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "manifest_path=$output_dir/manifest.json" >> "$GITHUB_OUTPUT"
            echo "markdown_path=$output_dir/report.md" >> "$GITHUB_OUTPUT"
            echo "html_path=$output_dir/report.html" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "reason=CURRENT_OBSERVATION_RENDER_FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Build and validate GitHub HTML report
        id: html_report
        if: steps.market_day.outputs.run == 'true' && steps.full_market.outputs.exit_code == '0' && steps.full_market.outputs.ready == 'true' && steps.report_contract.outputs.status == 'SUCCESS' && hashFiles('data/monitoring/latest-report-contract.json') != ''
        continue-on-error: true
        shell: bash
        env:
          HTML_OUTPUT_DIR: ${{ runner.temp }}/report-html
        run: |
          set +e
          mkdir -p "$HTML_OUTPUT_DIR"
          python3 tools/render_report_from_contract.py \
            --input data/monitoring/latest-report-contract.json \
            --output-dir "$HTML_OUTPUT_DIR" \
            --current-observation \
            > "$RUNNER_TEMP/html-report-result.json"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "exit_code=$code" >> "$GITHUB_OUTPUT"
            echo "::warning::Contract was published-ready, but the validated HTML view was not generated. Market data publication remains independent."
            exit 0
          fi
          html_as_of=$(python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path(__import__('os').environ['RUNNER_TEMP'], 'html-report-result.json').read_text(encoding='utf-8'))
          print(result.get('asOf') or '')
          PY
          )
          html_path=$(python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path(__import__('os').environ['RUNNER_TEMP'], 'html-report-result.json').read_text(encoding='utf-8'))
          print(result.get('datedHtml') or '')
          PY
          )
          latest_html_path=$(python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path(__import__('os').environ['RUNNER_TEMP'], 'html-report-result.json').read_text(encoding='utf-8'))
          print(result.get('html') or '')
          PY
          )
          if [ -z "$html_as_of" ] || [ ! -f "$html_path" ] || [ ! -f "$latest_html_path" ]; then
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            echo "::warning::Validated HTML output path is missing. Market data publication remains independent."
            exit 0
          fi
          html_sha256=$(sha256sum "$html_path" | awk '{print $1}')
          html_bytes=$(wc -c < "$html_path" | tr -d ' ')
          echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
          echo "as_of=$html_as_of" >> "$GITHUB_OUTPUT"
          echo "sha256=$html_sha256" >> "$GITHUB_OUTPUT"
          echo "bytes=$html_bytes" >> "$GITHUB_OUTPUT"
          echo "source_path=$html_path" >> "$GITHUB_OUTPUT"
          echo "latest_source_path=$latest_html_path" >> "$GITHUB_OUTPUT"
          html_filename=$(basename -- "$html_path")
          echo "path=data/reports/$html_filename" >> "$GITHUB_OUTPUT"
          echo "HTML validation succeeded: path=data/reports/$html_filename sha256=$html_sha256 bytes=$html_bytes"

      - name: Collect optional Kiwoom discovery quotes
        id: discovery_quotes
        if: steps.market_day.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          python tools/collect_trading_discovery_quotes.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::Kiwoom supplemental quote collection failed; core market publication and MARKET_DATA_READY remain eligible."
          fi
          exit 0

      - name: Preserve full-market failure diagnostic
        if: steps.market_day.outputs.run == 'true' && steps.full_market.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: full-market-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/full-market-current-error.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit refreshed production data
        id: publish
        if: steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code == '0' && (github.event_name != 'workflow_dispatch' || inputs.publish == true)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p data/krx/provenance
          cp "${{ steps.krx.outputs.krx_metadata_path }}" data/krx/provenance/refresh.json
          git add data/krx/provenance/refresh.json

          # relay.py owns these Universe-core outputs.  In particular, it does
          # not own data/market, data/research, or data/reports.
          git add \
            data/quotes.json data/quotes-lite.json \
            data/groups \
            data/technicals.json data/technicals-lite.json \
            data/states.json data/states-lite.json \
            data/group-states.json data/group-states-lite.json

          # Current-observation Markdown/HTML and their manifest are produced
          # from the just-built report contract.  They are independent of the
          # FINAL/Baseline gate and are therefore retained for intraday runs.
          if [ "${{ steps.observation_report.outputs.status }}" = "SUCCESS" ]; then
            git add \
              "${{ steps.observation_report.outputs.markdown_path }}" \
              "${{ steps.observation_report.outputs.html_path }}" \
              "${{ steps.observation_report.outputs.manifest_path }}"
          else
            echo "Current observation report is unavailable; market data and report delivery will be reported separately."
          fi

          if [ "${{ steps.indices.outputs.exit_code }}" = "0" ]; then
            git add data/market/indices.json
          else
            echo "Market index snapshot unavailable; preserving prior snapshot."
          fi

          if [ "${{ steps.full_market.outputs.ready }}" = "true" ] \
            && [ "${{ steps.full_market.outputs.exit_code }}" = "0" ]; then
            git add \
              data/monitoring/latest-breadth.json \
              data/monitoring/latest-stock-signals.json \
              data/monitoring/latest-theme-signals.json \
              data/monitoring/latest-industries.json \
              data/monitoring/latest-leaders.json \
              data/monitoring/latest-changes.json \
              data/monitoring/latest-quality.json \
              data/monitoring/latest-summary.json \
              data/dynamic-universe/latest.json \
              data/dynamic-universe/history.json
            if [ "${{ steps.report_contract.outputs.status }}" = "SUCCESS" ] \
              && [ -f data/monitoring/latest-report-contract.json ]; then
              git add data/monitoring/latest-report-contract.json
            else
              echo "Report contract unavailable; preserving the previous contract artifact."
            fi
          else
            echo "Evidence files are not eligible for publish; preserving prior evidence. Core 42-stock data remains publishable."
          fi

          echo "Intraday refresh does not publish daily rolling history; preserving monitoring-daily files."

          if [ "${{ steps.discovery_quotes.outputs.exit_code }}" = "0" ]; then
            git add -- data/trading-discovery/quotes
          else
            echo "Kiwoom supplemental quotes are not eligible for this market commit; preserving prior files."
          fi

          if [ -f data/dynamic-universe/v2-shadow-run-status.json ]; then
            git add -- data/dynamic-universe/v2-shadow-run-status.json
            if [ "$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('data/dynamic-universe/v2-shadow-run-status.json').read_text()).get('status'))
          except Exception:
              print('FAILED')
          PY
          )" = "OK" ]; then
              git add -- data/dynamic-universe/v2-shadow-latest.json data/dynamic-universe/v2-shadow-history.json
            else
              echo "V2 shadow failed; publishing only its run status and preserving prior V2 result/history."
            fi
          fi

          restore_generated_path() {
            path="$1"
            if git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git restore --source=HEAD --staged --worktree -- "$path"
            elif [ -e "$path" ]; then
              rm -f -- "$path"
            fi
          }

          # A contract is publishable only when generation succeeded and the
          # surrounding market publication is eligible.  Otherwise restore a
          # tracked prior contract or remove a newly-created runner-only file.
          contract_publish_eligible=false
          if [ "${{ steps.full_market.outputs.ready }}" = "true" ] \
            && [ "${{ steps.full_market.outputs.exit_code }}" = "0" ] \
            && [ "${{ steps.report_contract.outputs.status }}" = "SUCCESS" ] \
            && [ -f data/monitoring/latest-report-contract.json ]; then
            contract_publish_eligible=true
          fi
          if [ "$contract_publish_eligible" != "true" ]; then
            restore_generated_path data/monitoring/latest-report-contract.json
          fi

          html_publish_eligible=false
          published_html_sha256=""
          html_source="${{ steps.html_report.outputs.source_path }}"
          latest_html_source="${{ steps.html_report.outputs.latest_source_path }}"
          html_filename=$(basename -- "$html_source")
          html_target="$GITHUB_WORKSPACE/data/reports/$html_filename"
          latest_html_target="$GITHUB_WORKSPACE/data/reports/latest.html"
          if [ "$contract_publish_eligible" = "true" ] \
            && [ "${{ steps.html_report.outputs.status }}" = "SUCCESS" ] \
            && [ -f "$html_source" ] \
            && [ -f "$latest_html_source" ]; then
            mkdir -p data/reports
            cp -- "$html_source" "$html_target"
            cp -- "$latest_html_source" "$latest_html_target"
            published_html_sha256=$(sha256sum "$html_target" | awk '{print $1}')
            latest_html_sha256=$(sha256sum "$latest_html_target" | awk '{print $1}')
            if [ -s "$html_target" ] \
              && [ -s "$latest_html_target" ] \
              && [ "$published_html_sha256" = "${{ steps.html_report.outputs.sha256 }}" ] \
              && [ "$latest_html_sha256" = "$published_html_sha256" ]; then
              git add -- \
                "data/reports/$html_filename" \
                data/reports/latest.html
              html_publish_eligible=true
            else
              echo "::error::Published HTML path or SHA-256 does not match the generated HTML."
            fi
          else
            echo "Validated HTML is unavailable or the contract is not publishable; no HTML view will be added."
          fi
          echo "html_published=$html_publish_eligible" >> "$GITHUB_OUTPUT"
          echo "html_sha256=$published_html_sha256" >> "$GITHUB_OUTPUT"
          echo "html_bytes=${{ steps.html_report.outputs.bytes }}" >> "$GITHUB_OUTPUT"
          echo "html_path=data/reports/$html_filename" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo "No data changes to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "publication_usable=true" >> "$GITHUB_OUTPUT"
            echo "publication_changed=false" >> "$GITHUB_OUTPUT"
            echo "production_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh NAVER market data"
            # FINAL daily history is intentionally outside this intraday writer.
            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              echo "::error::Unexpected unstaged or untracked files remain before data synchronization; preserving production data."
              git status --short
              exit 1
            fi
            echo "Market data collection succeeded; synchronizing its data commit."
            for attempt in 1 2 3; do
              echo "Push synchronization attempt ${attempt}/3"
              target_ref="${GITHUB_REF_NAME:-main}"
              git fetch origin "$target_ref"
              if ! git rebase "origin/${target_ref}"; then
                echo "::error::Data commit conflicts with newer main. No automatic conflict resolution or force push was attempted."
                git rebase --abort || true
                exit 1
              fi
              target_ref="${GITHUB_REF_NAME:-main}"
              if git push origin "HEAD:${target_ref}"; then
                echo "Market data push succeeded."
                echo "published=true" >> "$GITHUB_OUTPUT"
                echo "publication_usable=true" >> "$GITHUB_OUTPUT"
                echo "publication_changed=true" >> "$GITHUB_OUTPUT"
                echo "production_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Push was rejected because main advanced; retrying with latest main."
            done
            echo "::error::Data collection succeeded, but push was rejected after 3 attempts."
            exit 1
          fi

      - name: Record production publication provenance
        if: steps.publish.outputs.production_commit_sha != ''
        shell: bash
        env:
          PRODUCTION_COMMIT_SHA: ${{ steps.publish.outputs.production_commit_sha }}
          PUBLICATION_CHANGED: ${{ steps.publish.outputs.publication_changed }}
          HTML_PUBLISHED: ${{ steps.publish.outputs.html_published }}
          HTML_SHA256: ${{ steps.publish.outputs.html_sha256 }}
          HTML_BYTES: ${{ steps.publish.outputs.html_bytes }}
          HTML_PATH: ${{ steps.publish.outputs.html_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"], "production-publication.json").write_text(json.dumps({
              "runId": os.environ["GITHUB_RUN_ID"],
              "headSha": os.environ["GITHUB_SHA"],
              "productionCommitSha": os.environ["PRODUCTION_COMMIT_SHA"],
              "publicationChanged": os.environ["PUBLICATION_CHANGED"] == "true",
              "htmlPublished": os.environ.get("HTML_PUBLISHED") == "true",
              "htmlSha256": os.environ.get("HTML_SHA256") or None,
              "htmlBytes": int(os.environ["HTML_BYTES"]) if os.environ.get("HTML_BYTES", "").isdigit() else None,
              "htmlPath": os.environ.get("HTML_PATH") or None,
          }, ensure_ascii=False, sort_keys=True), encoding="utf-8")
          PY

      - name: Upload production publication provenance
        if: steps.publish.outputs.production_commit_sha != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-publication-${{ github.run_id }}-${{ steps.publish.outputs.production_commit_sha }}-${{ steps.publish.outputs.publication_changed }}
          path: ${{ runner.temp }}/production-publication.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail when current observation report is unavailable
        if: >-
          steps.market_day.outputs.run == 'true' &&
          steps.full_market.outputs.exit_code == '0' &&
          steps.full_market.outputs.ready == 'true' &&
          steps.publish.outputs.publication_changed == 'true' &&
          (
            steps.report_contract.outputs.status != 'SUCCESS' ||
            steps.observation_report.outputs.status != 'SUCCESS' ||
            steps.html_report.outputs.status != 'SUCCESS' ||
            steps.publish.outputs.html_published != 'true'
          )
        run: |
          echo "::error::Current observation Markdown/HTML was not generated and validated; MARKET_DATA_READY is blocked."
          exit 1

      - name: Send MARKET_DATA_READY signal
        id: ready_email
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.market_day.outputs.run == 'true' &&
          steps.collect.outputs.exit_code == '0' &&
          steps.full_market.outputs.exit_code == '0' &&
          steps.full_market.outputs.ready == 'true' &&
          steps.report_contract.outputs.status == 'SUCCESS' &&
          steps.observation_report.outputs.status == 'SUCCESS' &&
          steps.html_report.outputs.status == 'SUCCESS' &&
          steps.publish.outputs.publication_changed == 'true' &&
          steps.publish.outputs.html_published == 'true' &&
          (steps.publish.outputs.publication_usable == 'true' || steps.publish.outputs.published == 'true')
        env:
          MARKET_GMAIL_USERNAME: ${{ secrets.MARKET_GMAIL_USERNAME }}
          MARKET_GMAIL_APP_PASSWORD: ${{ secrets.MARKET_GMAIL_APP_PASSWORD }}
          MARKET_GMAIL_TO: ${{ secrets.MARKET_GMAIL_TO }}
          MARKET_DATA_COMMIT_SHA: ${{ steps.publish.outputs.production_commit_sha }}
          MARKET_DATA_PUBLICATION_CHANGED: ${{ steps.publish.outputs.publication_changed }}
          MARKET_DATA_COLLECTION_STARTED_AT: ${{ steps.collect.outputs.collection_started_at }}
          MARKET_DATA_COLLECTION_FINISHED_AT: ${{ steps.collect.outputs.collection_finished_at }}
          FULL_MARKET_STATUS: ${{ steps.full_market.outputs.market_status }}
          FULL_MARKET_FAILURE_REASON: ${{ steps.full_market.outputs.failure_reason }}
          FULL_MARKET_LAST_PUBLISHED_AT: ${{ steps.full_market.outputs.last_published_at }}
          FULL_MARKET_REQUIRED: 'true'
          CURRENT_OBSERVATION_MANIFEST_PATH: ${{ steps.observation_report.outputs.manifest_path }}
          MARKET_HTML_PUBLISHED: ${{ steps.publish.outputs.html_published }}
          MARKET_HTML_STATUS: ${{ steps.html_report.outputs.status || 'UNAVAILABLE' }}
          MARKET_HTML_SHA256: ${{ steps.publish.outputs.html_sha256 }}
          MARKET_HTML_BYTES: ${{ steps.publish.outputs.html_bytes }}
          MARKET_HTML_PATH: ${{ steps.publish.outputs.html_path }}
        run: python send_market_data_ready.py

      - name: Warn when MARKET_DATA_READY signal fails
        if: steps.ready_email.outcome == 'failure'
        run: echo "::warning::MARKET_DATA_READY email was not sent; market data publication remains successful."

      - name: Commit collector diagnostic only
        if: steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code != '0' && steps.full_market.outputs.exit_code != '0' && hashFiles('data/status/quotes-error.json') != '' && (github.event_name != 'workflow_dispatch' || inputs.publish == true)
        shell: bash
        run: |
          echo "Collector failed; preserving last successful production snapshot."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/status/quotes-error.json
          if git diff --cached --quiet; then
            echo "No new collector diagnostic to commit"
            exit 0
          fi
          git commit -m "Record NAVER quote collection failure"
          target_ref="${GITHUB_REF_NAME:-main}"
          git fetch origin "$target_ref"
          if ! git rebase "origin/${target_ref}"; then
            echo "::error::Diagnostic commit conflicts with newer main. No automatic conflict resolution or force push was attempted."
            git rebase --abort || true
            exit 1
          fi
          target_ref="${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${target_ref}"

      - name: Fail after preserving production snapshot
        if: steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code != '0' && steps.full_market.outputs.exit_code != '0'
        run: |
          echo "Collector failed; preserving last successful production snapshot."
          exit 1

      - name: Fail after preserving production snapshot on evidence error
        if: steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code == '0' && steps.full_market.outputs.exit_code != '0'
        run: |
          echo "Full-market evidence failed; core 42-stock publication and MARKET_DATA_READY remain eligible."

      - name: Report NO_PUBLISH validation result
        if: github.event_name == 'workflow_dispatch' && inputs.publish == false
        run: |
          echo "NO_PUBLISH: validation completed; no commit, push, main publication, or provenance publication was performed."
