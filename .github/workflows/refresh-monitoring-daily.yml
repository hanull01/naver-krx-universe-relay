name: Refresh full-market rolling daily state

run-name: KRX report ${{ inputs.krx_generation_id || 'missing-generation' }} ${{ inputs.krx_expected_date || 'missing-date' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate collection and baseline without publishing files
        required: false
        default: false
        type: boolean
      krx_expected_date:
        description: Expected KRX generation trading date (YYYYMMDD)
        required: false
        type: string
      krx_ref:
        description: Immutable private KRX branch or commit SHA
        required: false
        default: codex/krx-private-sync
        type: string
      krx_generation_id:
        description: Expected immutable KRX generation ID
        required: false
        type: string
      publish:
        description: Publish generated rolling state; false performs validation only
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: generated-data-write
  cancel-in-progress: false

jobs:
  refresh-full-market-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check KRX trading day
        id: market_day
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set +e
          set -o pipefail
          python krx_market_day.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "KRX trading day confirmed."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KRX calendar unavailable or market closed; preserving rolling state and baseline."
          fi
          exit 0

      - name: Run rolling-state tests
        if: steps.market_day.outputs.run == 'true'
        run: |
          python -m py_compile \
            tools/build_monitoring_daily_state.py \
            tools/monitoring_daily_state_update.py \
            tools/daily_monitoring_baseline.py
          python -m unittest \
            test_monitoring_daily_state_update.py \
            test_monitoring_local_date_collection.py \
            test_daily_monitoring_baseline.py -v

      - name: Resolve approved KRX generation
        id: krx
        if: steps.market_day.outputs.run == 'true'
        uses: ./.github/actions/resolve-krx-generation
        with:
          token: ${{ secrets.KRX_PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.krx_ref || 'codex/krx-private-sync' }}
          expected-date: ${{ inputs.krx_expected_date || '' }}
          generation-id: ${{ inputs.krx_generation_id || '' }}
          output-dir: ${{ runner.temp }}/krx-report-input

      - name: Resolve intraday rolling-state window
        id: closing_window
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          target_date='${{ steps.krx.outputs.krx_target_date }}'
          if [ -n "$target_date" ]; then
            echo "status=KRX_PRIMARY_AVAILABLE" >> "$GITHUB_OUTPUT"
            echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Using KRX morning generation for rolling-state input: $target_date"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "status=KRX_ROLLING_STATE_UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "target_date=" >> "$GITHUB_OUTPUT"
            echo "::notice::KRX_ROLLING_STATE_UNAVAILABLE: recording NOOP; intraday report is not blocked by final-close timing."
          fi

      - name: Sync latest main before collection
        if: steps.market_day.outputs.run == 'true' && steps.closing_window.outputs.eligible == 'true'
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Record unavailable rolling-state NOOP
        if: steps.market_day.outputs.run == 'true' && steps.closing_window.outputs.eligible != 'true'
        shell: bash
        run: |
          {
            echo "## Monitoring daily rolling state"
            echo "- status: \\`KRX_ROLLING_STATE_UNAVAILABLE\\`"
            echo "- result: \\`NOOP\\`"
            echo "- intraday refresh remains independent of final-close timing"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect, validate, and update rolling state
        id: update
        if: steps.market_day.outputs.run == 'true' && steps.closing_window.outputs.eligible == 'true'
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set +e
          set -o pipefail
          target_date='${{ steps.closing_window.outputs.target_date }}'
          extra=()
          if [ "$DRY_RUN" = "true" ]; then extra+=(--no-write); fi
          if [ "${{ vars.PARTIAL_FINAL_ENABLED }}" = "true" ]; then extra+=(--allow-partial); fi
          now_kst=$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Seoul")).isoformat())')
          echo "Full-market daily collection: targetDate=${target_date}, nowKst=${now_kst}"
          result_file="$RUNNER_TEMP/monitoring-daily-update-result.json"
          python tools/build_monitoring_daily_state.py update-latest \
            --fetch-today --refresh-universe --date "$target_date" "${extra[@]}" | tee "$result_file"
          pipeline_codes=("${PIPESTATUS[@]}")
          code=${pipeline_codes[0]}
          log_code=${pipeline_codes[1]}
          echo "python_exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "log_exit_code=$log_code" >> "$GITHUB_OUTPUT"
          echo "Daily update exit codes: python=$code tee=$log_code"
          status=$(tail -n 1 "$result_file" | python -c 'import json,sys; print(json.load(sys.stdin).get("status", "FAILED"))' 2>/dev/null || echo FAILED)
          echo "final_status=$status" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] && [ "$log_code" -eq 0 ] && [ "$status" = "SUCCESS" ]; then
            echo "partial=false" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" = "PARTIAL" ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
          else
            echo "partial=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::error::Daily update not publishable: status=$status python_exit=$code tee_exit=$log_code"
          if [ "$code" -eq 2 ]; then
            echo "::error::Daily rows remained incomplete after per-code bounded retries; preserving prior universe, rolling state, and baseline."
          elif [ "$code" -eq 4 ]; then
            echo "::error::UNIVERSE_HISTORY_REQUIRED: authoritative market membership changed; preserving all production artifacts."
          else
            echo "::error::Non-retryable daily update failure (exit=${code}); preserving all production artifacts."
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          if [ "$log_code" -ne 0 ]; then exit "$log_code"; fi
          exit 1

      - name: Stage KRX source metadata
        if: steps.market_day.outputs.run == 'true' && steps.update.outcome == 'success' && steps.update.outputs.ready == 'true'
        run: |
          mkdir -p data/krx/provenance
          cp "${{ steps.krx.outputs.krx_metadata_path }}" data/krx/provenance/monitoring-daily.json

      - name: Commit final rolling state and baseline
        id: publish
        if: steps.market_day.outputs.run == 'true' && steps.update.outcome == 'success' && steps.update.outputs.ready == 'true' && steps.update.outputs.final_status == 'SUCCESS' && inputs.dry_run != true && (github.event_name != 'workflow_dispatch' || inputs.publish == true)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Whitelist only the rolling-state and separate session-diagnostic
          # generation artifacts.  Never
          # stage raw NAVER rows, canonical history, temporary files, or code.
          git add -- \
            data/market-universe/all-assets.json \
            data/krx/provenance/monitoring-daily.json \
            data/monitoring-daily/kospi.json \
            data/monitoring-daily/kosdaq.json \
            data/monitoring-daily/universe-lifecycle.json \
            data/monitoring-daily/retired.json
          if [ -f data/monitoring-daily/trading-session-diagnostic.json ]; then
            git add -- data/monitoring-daily/trading-session-diagnostic.json
          fi
          if [ "${{ steps.update.outputs.partial }}" != "true" ]; then
            git add -- data/monitoring-baseline/latest.json
          else
            echo "PARTIAL result: baseline is intentionally not staged."
          fi
          expected=$'data/krx/provenance/monitoring-daily.json\ndata/market-universe/all-assets.json\ndata/monitoring-baseline/latest.json\ndata/monitoring-daily/kosdaq.json\ndata/monitoring-daily/retired.json\ndata/monitoring-daily/trading-session-diagnostic.json\ndata/monitoring-daily/universe-lifecycle.json'
          actual=$(git diff --cached --name-only | LC_ALL=C sort)
          if [ -z "$actual" ]; then
            echo "No rolling-state changes to commit (same-day NOOP)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unexpected=""
          while IFS= read -r path; do
            case "$path" in
              data/market-universe/all-assets.json|\
              data/monitoring-baseline/latest.json|\
              data/monitoring-daily/kospi.json|\
              data/monitoring-daily/kosdaq.json|\
              data/monitoring-daily/universe-lifecycle.json|\
              data/monitoring-daily/retired.json|\
              data/monitoring-daily/trading-session-diagnostic.json) ;;
              *) unexpected+="$path\n" ;;
            esac
          done <<< "$actual"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected staged paths; refusing commit."
            printf '%b' "$unexpected"
            exit 1
          fi
          git commit -m "Refresh full-market rolling daily state"
          for attempt in 1 2 3; do
            echo "Push synchronization attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rolling-state commit conflicts with newer main. No automatic resolution or force push was attempted."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Push rejected after 3 attempts; no force push was attempted."
          exit 1

      - name: Report dry-run success
        if: steps.market_day.outputs.run == 'true' && steps.update.outcome == 'success' && steps.update.outputs.ready == 'true' && steps.update.outputs.final_status == 'SUCCESS' && inputs.dry_run == true
        run: echo "Dry-run succeeded; no rolling state or baseline was published."

      - name: Report NO_PUBLISH validation result
        if: github.event_name == 'workflow_dispatch' && inputs.publish == false && inputs.dry_run != true
        run: |
          echo "NO_PUBLISH: validation completed; no commit, push, main publication, or provenance publication was performed."
