name: Refresh full-market rolling daily state

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate collection and baseline without publishing files
        required: false
        default: false
        type: boolean
  schedule:
    # 15:45 KST (06:45 UTC) follows the existing 15:40 42-stock daily job.
    # Time starts collection only; NAVER's complete 2,768-row daily response
    # and KRX calendar validation decide whether a FINAL state may publish.
    - cron: "45 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: generated-data-write
  cancel-in-progress: false

jobs:
  refresh-full-market-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check KRX trading day
        id: market_day
        shell: bash
        run: |
          set +e
          python krx_market_day.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "KRX trading day confirmed."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KRX calendar unavailable or market closed; preserving rolling state and baseline."
          fi
          exit 0

      - name: Run rolling-state tests
        if: steps.market_day.outputs.run == 'true'
        run: |
          python -m py_compile \
            tools/build_monitoring_daily_state.py \
            tools/monitoring_daily_state_update.py \
            tools/daily_monitoring_baseline.py
          python -m unittest \
            test_monitoring_daily_state_update.py \
            test_daily_monitoring_baseline.py -v

      - name: Check KST regular-close window
        id: closing_window
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          window=$(python tools/build_monitoring_daily_state.py --closing-window)
          echo "$window"
          status=$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$window")
          target_date=$(python -c 'import json,sys; print(json.load(sys.stdin)["targetDate"])' <<<"$window")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          if [ "$status" = "AFTER_REGULAR_CLOSE" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BEFORE_REGULAR_CLOSE: skipping NAVER fetch, retry, and publish."
          fi

      - name: Sync latest main before collection
        if: steps.market_day.outputs.run == 'true' && steps.closing_window.outputs.eligible == 'true'
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Collect, validate, and update rolling state
        id: update
        if: steps.market_day.outputs.run == 'true' && steps.closing_window.outputs.eligible == 'true'
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set +e
          target_date='${{ steps.closing_window.outputs.target_date }}'
          extra=()
          if [ "$DRY_RUN" = "true" ]; then extra+=(--no-write); fi
          now_kst=$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Seoul")).isoformat())')
          echo "Full-market daily collection: targetDate=${target_date}, nowKst=${now_kst}"
          python tools/build_monitoring_daily_state.py update-latest \
            --fetch-today --refresh-universe --date "$target_date" "${extra[@]}"
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::error::Daily rows remained incomplete after per-code bounded retries; preserving prior universe, rolling state, and baseline."
          elif [ "$code" -eq 4 ]; then
            echo "::error::UNIVERSE_HISTORY_REQUIRED: new authoritative stocks require explicit history bootstrap; preserving all production artifacts."
          else
            echo "::error::Non-retryable daily update failure (exit=${code}); preserving all production artifacts."
          fi
          exit "$code"

      - name: Commit final rolling state and baseline
        id: publish
        if: steps.market_day.outputs.run == 'true' && steps.update.outputs.ready == 'true' && inputs.dry_run != true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Whitelist only the five lifecycle generation artifacts.  Never
          # stage raw NAVER rows, canonical history, temporary files, or code.
          git add -- \
            data/market-universe/all-assets.json \
            data/monitoring-daily/kospi.json \
            data/monitoring-daily/kosdaq.json \
            data/monitoring-daily/universe-lifecycle.json \
            data/monitoring-baseline/latest.json
          expected=$'data/market-universe/all-assets.json\ndata/monitoring-baseline/latest.json\ndata/monitoring-daily/kosdaq.json\ndata/monitoring-daily/kospi.json\ndata/monitoring-daily/universe-lifecycle.json'
          actual=$(git diff --cached --name-only | LC_ALL=C sort)
          if [ -z "$actual" ]; then
            echo "No rolling-state changes to commit (same-day NOOP)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected staged paths; refusing commit."
            exit 1
          fi
          git commit -m "Refresh full-market rolling daily state"
          for attempt in 1 2 3; do
            echo "Push synchronization attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rolling-state commit conflicts with newer main. No automatic resolution or force push was attempted."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Push rejected after 3 attempts; no force push was attempted."
          exit 1

      - name: Report dry-run success
        if: steps.market_day.outputs.run == 'true' && steps.update.outputs.ready == 'true' && inputs.dry_run == true
        run: echo "Dry-run succeeded; no rolling state or baseline was published."
