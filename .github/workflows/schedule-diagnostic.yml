name: Schedule diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Print schedule evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "event_name=${EVENT_NAME}"
          echo "github.event.schedule=${EVENT_SCHEDULE}"
          echo "github.run_id=${RUN_ID}"
          echo "github.sha=${COMMIT_SHA}"
          echo "utc_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "kst_time=$(TZ=Asia/Seoul date '+%Y-%m-%dT%H:%M:%S%z')"
