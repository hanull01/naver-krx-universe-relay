name: Refresh market snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "naver_market.py"
      - "test_naver_market.py"
      - "docs/naver-market-data.md"
      - ".github/workflows/refresh-market-snapshots.yml"
  schedule:
    # Event-driven reports consume the latest published snapshot. Run at
    # :10, :30, :50 from 08:10 through 19:50 KST on weekdays.
    - cron: "10,30,50 23 * * 0-4"
    - cron: "10,30,50 0-10 * * 1-5"

permissions:
  contents: write

concurrency:
  # One repository-wide generated-data writer.  data/market has a single
  # owner, but every generated-data commit still advances main.
  group: generated-data-write
  cancel-in-progress: false

jobs:
  refresh-market-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check KRX trading day
        id: market_day
        shell: bash
        run: |
          set +e
          python krx_market_day.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping market snapshot collection (closed market or unverifiable KRX calendar)."
          fi
          exit 0

      - name: Test market collector
        if: steps.market_day.outputs.run == 'true'
        run: python -m unittest test_naver_market.py test_krx_market_day.py -v

      - name: Sync latest main before collection
        if: steps.market_day.outputs.run == 'true'
        run: git pull --ff-only origin main

      - name: Collect market snapshots
        id: collect
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          python naver_market.py all
          code=$?
          # Membership is a separate, low-frequency cache: the command only
          # makes NAVER calls after its 24-hour TTL has expired.
          python naver_market.py industry-membership --if-stale
          if [ "$?" -ne 0 ]; then code=1; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit market snapshots
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market
          if git diff --cached --quiet; then
            echo "No market snapshot changes to commit"
          else
            git commit -m "Refresh NAVER market snapshots"
            echo "Market snapshot collection succeeded; synchronizing its data commit."
            for attempt in 1 2 3; do
              echo "Push synchronization attempt ${attempt}/3"
              pre_rebase_head="$(git rev-parse HEAD)"
              git fetch origin main
              origin_main="$(git rev-parse origin/main)"
              echo "Push diagnostics attempt=${attempt} originMain=${origin_main} preRebaseHead=${pre_rebase_head}"
              # The commit contains only freshly collected data/market files.
              # If another generated-data writer advanced main, preserve this
              # successful snapshot while replaying it onto the newest main.
              if ! git rebase -X theirs origin/main; then
                echo "::error::Data commit conflicts with newer main. No automatic conflict resolution or force push was attempted."
                git rebase --abort || true
                exit 1
              fi
              post_rebase_head="$(git rev-parse HEAD)"
              echo "Push diagnostics attempt=${attempt} postRebaseHead=${post_rebase_head}"
              push_log="$(mktemp)"
              set +e
              git push origin HEAD:main 2> >(tee "$push_log" >&2)
              push_exit=$?
              set -e
              echo "Push diagnostics attempt=${attempt} exitCode=${push_exit}"
              if [ "$push_exit" -eq 0 ]; then
                rm -f "$push_log"
                echo "Market snapshot data push succeeded."
                exit 0
              fi
              if grep -Eqi 'non-fast-forward|fetch first|rejected.*non-fast-forward' "$push_log"; then
                push_classification="NON_FAST_FORWARD"
              elif grep -Eqi 'authentication failed|permission denied|could not read username|403|write access.*not granted' "$push_log"; then
                push_classification="AUTH_PERMISSION"
              elif grep -Eqi 'protected branch|repository rule|GH006|GH013' "$push_log"; then
                push_classification="BRANCH_POLICY"
              elif grep -Eqi 'HTTP (502|503|504)|remote end hung up|connection reset|timed out|temporarily unavailable' "$push_log"; then
                push_classification="TRANSIENT_GITHUB"
              else
                push_classification="UNKNOWN_PUSH_FAILURE"
              fi
              rm -f "$push_log"
              echo "Push failed; classification=${push_classification}; retrying with latest main."
              if [ "$attempt" -lt 3 ]; then
                sleep 2
              fi
            done
            echo "::error::Data collection succeeded, but push was rejected after 3 attempts."
            exit 1
          fi

      - name: Fail after publishing error snapshots
        if: steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code != '0'
        run: |
          echo "Market collector reported one or more failures."
          exit 1
