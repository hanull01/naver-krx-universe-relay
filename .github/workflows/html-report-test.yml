name: HTML_REPORT_TEST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: 6795f3499321f31704a18c51182b8207ee898327
      SOURCE_CONTRACT: data/monitoring/latest-report-contract.json
      SOURCE_TRADING_DATE: 2026-10-30
    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch fixed source contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git cat-file -e "$SOURCE_COMMIT:$SOURCE_CONTRACT"
          mkdir -p "$RUNNER_TEMP/html-report-test"
          git show "$SOURCE_COMMIT:$SOURCE_CONTRACT" > "$RUNNER_TEMP/html-report-test/contract.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'html-report-test'/'contract.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          asof=str(d.get('asOf') or d.get('tradingDate') or '')
          if asof.replace('-','') != os.environ['SOURCE_TRADING_DATE'].replace('-',''):
              raise SystemExit('source trading date mismatch: '+asof)
          source_html_allowed=bool(d.get('rendering',{}).get('htmlAllowed',False))
          test_payload=dict(d)
          test_rendering=dict(d.get('rendering') or {})
          if not source_html_allowed:
              # Test-only derived input: preserve every source quality field while
              # making the renderer exerciseable without changing the production contract.
              test_rendering['sourceHtmlAllowed']=False
              test_rendering['testOnlyOverride']=True
              test_rendering['htmlAllowed']=True
              test_rendering['reason']='TEST_ONLY_RENDERING_OVERRIDE:'+str(test_rendering.get('reason') or 'UNAVAILABLE')
              test_payload['rendering']=test_rendering
              test_payload['testMode']='HTML_REPORT_TEST'
              test_payload['testNotice']='TEST ONLY: production htmlAllowed remains false; this derived input is not publishable.'
          test_path=Path(os.environ['RUNNER_TEMP'])/'html-report-test'/'test-contract.json'
          test_path.write_text(json.dumps(test_payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write('SOURCE_HTML_ALLOWED='+str(source_html_allowed).lower()+'\n')
              env.write('TEST_ONLY_HTML_OVERRIDE='+str((not source_html_allowed)).lower()+'\n')
          print(json.dumps({'sourceHtmlAllowed':source_html_allowed,'testOnlyHtmlOverride':not source_html_allowed,'sourceBytes':p.stat().st_size,'testBytes':test_path.stat().st_size},ensure_ascii=False))
          PY
      - name: Render and validate Markdown plus HTML
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/html-report-test"
          out="$root/output"
          python tools/render_report_from_contract.py --input "$root/test-contract.json" --output-dir "$out" > "$root/render.json"
          test -s "$out/2026-10-30.md"
          test -s "$out/2026-10-30.html"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'html-report-test'
          md=root/'output'/'2026-10-30.md'; html=root/'output'/'2026-10-30.html'
          mt=md.read_text(encoding='utf-8'); ht=html.read_text(encoding='utf-8')
          required=['CONTRACT_TRACE','V2_DATA_TRACE','TEMPLATE_TRACE']
          if any(x not in mt or x not in ht for x in required): raise SystemExit('trace missing')
          if '<pre>' in ht or '2,205/2,767' in ht: raise SystemExit('stale HTML detected')
          manifest={
            'testMode':'HTML_REPORT_TEST','repository':os.environ['GITHUB_REPOSITORY'],
            'workflow':os.environ['GITHUB_WORKFLOW'],'runId':os.environ['GITHUB_RUN_ID'],
            'runUrl':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
            'sourceTradingDate':os.environ['SOURCE_TRADING_DATE'],'sourceCommit':os.environ['SOURCE_COMMIT'],
            'sourceContract':os.environ['SOURCE_CONTRACT'],'sourceHtmlAllowed':os.environ.get('SOURCE_HTML_ALLOWED','false') == 'true','testOnlyHtmlOverride':os.environ.get('TEST_ONLY_HTML_OVERRIDE','false') == 'true',
            'htmlSha256':hashlib.sha256(html.read_bytes()).hexdigest(),
            'htmlBytes':html.stat().st_size,'markdownSha256':hashlib.sha256(md.read_bytes()).hexdigest(),
            'markdownBytes':md.stat().st_size,'htmlFile':'2026-10-30.html','markdownFile':'2026-10-30.md'}
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False))
          PY
      - name: Publish verified files to public test branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/html-report-test"
          branch="html-report-test/$GITHUB_RUN_ID"
          public_dir="test-artifacts/html-report-test-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin main
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'html-report-test'
          manifest_path=root/'manifest.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          branch=f"html-report-test/{os.environ['GITHUB_RUN_ID']}"
          public_dir=f"test-artifacts/html-report-test-{os.environ['GITHUB_RUN_ID']}"
          base=f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{branch}/{public_dir}"
          manifest.update({
              'publicBranch': branch,
              'publicDir': public_dir,
              'htmlUrl': f"{base}/2026-10-30.html",
              'markdownUrl': f"{base}/2026-10-30.md",
              'manifestUrl': f"{base}/manifest.json",
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({'publicBranch':branch,'publicDir':public_dir,'htmlUrl':manifest['htmlUrl'],'markdownUrl':manifest['markdownUrl'],'manifestUrl':manifest['manifestUrl']},ensure_ascii=False))
          PY
          git switch --create "$branch" origin/main
          mkdir -p "$public_dir"
          cp "$root/output/2026-10-30.html" "$public_dir/2026-10-30.html"
          cp "$root/output/2026-10-30.md" "$public_dir/2026-10-30.md"
          cp "$root/manifest.json" "$public_dir/manifest.json"
          git add "$public_dir"
          git commit -m "Publish HTML_REPORT_TEST $GITHUB_RUN_ID"
          git push origin "HEAD:$branch"
          html_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$branch/$public_dir/2026-10-30.html"
          markdown_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$branch/$public_dir/2026-10-30.md"
          manifest_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$branch/$public_dir/manifest.json"
          curl -fsSL --retry 12 --retry-delay 2 "$html_url" -o "$root/downloaded.html"
          curl -fsSL --retry 12 --retry-delay 2 "$markdown_url" -o "$root/downloaded.md"
          curl -fsSL --retry 12 --retry-delay 2 "$manifest_url" -o "$root/downloaded-manifest.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'html-report-test'
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          html=(root/'downloaded.html').read_bytes()
          markdown=(root/'downloaded.md').read_bytes()
          expected_html=(root/'output'/'2026-10-30.html').read_bytes()
          expected_markdown=(root/'output'/'2026-10-30.md').read_bytes()
          if html != expected_html or markdown != expected_markdown:
              raise SystemExit('public download does not match generated output')
          if hashlib.sha256(html).hexdigest() != manifest['htmlSha256']:
              raise SystemExit('public HTML SHA mismatch')
          if hashlib.sha256(markdown).hexdigest() != manifest['markdownSha256']:
              raise SystemExit('public Markdown SHA mismatch')
          public_manifest=json.loads((root/'downloaded-manifest.json').read_text(encoding='utf-8'))
          for key in ('htmlUrl','markdownUrl','manifestUrl','publicBranch','publicDir'):
              if public_manifest.get(key) != manifest.get(key):
                  raise SystemExit(f'public manifest mismatch: {key}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write(f"PUBLIC_HTML_URL={manifest['htmlUrl']}\n")
              env.write(f"PUBLIC_MARKDOWN_URL={manifest['markdownUrl']}\n")
              env.write(f"PUBLIC_MANIFEST_URL={manifest['manifestUrl']}\n")
              env.write(f"PUBLIC_TEST_BRANCH={manifest['publicBranch']}\n")
          print(json.dumps({'publicHtmlUrl':manifest['htmlUrl'],'publicMarkdownUrl':manifest['markdownUrl'],'publicManifestUrl':manifest['manifestUrl'],'htmlSha256':manifest['htmlSha256'],'markdownSha256':manifest['markdownSha256']},ensure_ascii=False))
          PY

      - name: Upload verified test files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/html-report-test/output/2026-10-30.md
            ${{ runner.temp }}/html-report-test/output/2026-10-30.html
            ${{ runner.temp }}/html-report-test/manifest.json
            ${{ runner.temp }}/html-report-test/contract.json
            ${{ runner.temp }}/html-report-test/test-contract.json
          if-no-files-found: error
          retention-days: 7
      - name: Send one HTML_REPORT_TEST email
        env:
          MARKET_GMAIL_USERNAME: ${{ secrets.MARKET_GMAIL_USERNAME }}
          MARKET_GMAIL_APP_PASSWORD: ${{ secrets.MARKET_GMAIL_APP_PASSWORD }}
          MARKET_GMAIL_TO: ${{ secrets.MARKET_GMAIL_TO }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, smtplib
          from email.message import EmailMessage
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'html-report-test'/'manifest.json').read_text(encoding='utf-8'))
          e=EmailMessage(); e['Subject']='HTML_REPORT_TEST'; e['From']=os.environ['MARKET_GMAIL_USERNAME']; e['To']=os.environ['MARKET_GMAIL_TO']
          e.set_content('\n'.join([
            'TEST ONLY — HTML_REPORT_TEST','testMode='+m['testMode'],'repository='+m['repository'],
            'workflow='+m['workflow'],'run_id='+m['runId'],'run_url='+m['runUrl'],
            'sourceTradingDate='+m['sourceTradingDate'],'sourceCommit='+m['sourceCommit'],
            'sourceHtmlAllowed='+str(m['sourceHtmlAllowed']).lower(),'testOnlyHtmlOverride='+str(m['testOnlyHtmlOverride']).lower(),
            'sourceContract='+m['sourceContract'],'publicBranch='+m['publicBranch'],'publicDir='+m['publicDir'],
            'html.url='+m['htmlUrl'],'html.sha256='+m['htmlSha256'],'html.bytes='+str(m['htmlBytes']),
            'markdown.url='+m['markdownUrl'],'markdown.sha256='+m['markdownSha256'],
            'manifest.url='+m['manifestUrl'],
            'markdown.bytes='+str(m['markdownBytes']),'artifact='+m['workflow']+'-'+m['runId'],
            'This is a test message; do not treat it as MARKET_DATA_READY.'])+'\n')
          with smtplib.SMTP_SSL('smtp.gmail.com',465,timeout=20) as s:
              s.login(os.environ['MARKET_GMAIL_USERNAME'],os.environ['MARKET_GMAIL_APP_PASSWORD']); s.send_message(e)
          print('HTML_REPORT_TEST SMTP send succeeded')
          PY
