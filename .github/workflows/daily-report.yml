name: Build daily market report

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Optional already-published trading date (YYYY-MM-DD) for manual validation'
        required: false
        type: string
      krx_expected_date:
        description: Expected KRX generation trading date (YYYYMMDD); defaults to as_of when provided
        required: false
        type: string
permissions:
  contents: write

# Every generated-data workflow shares one main-branch writer queue.
concurrency:
  group: generated-data-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check KRX trading day
        id: market_day
        shell: bash
        run: |
          # Manual runs are allowed for validation even on non-trading days.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "expected_date=" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: trading-day gate bypassed."
            exit 0
          fi

          # This is the scheduled KRX-calendar target, not trading-date
          # evidence.  The report must still resolve its date from published
          # evidence and match this calendar-verified target below.
          scheduled_date=$(TZ=Asia/Seoul date +%F)
          set +e
          python krx_market_day.py --date "$scheduled_date"
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "expected_date=$scheduled_date" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "expected_date=" >> "$GITHUB_OUTPUT"
            echo "Skipping daily report: closed or unverifiable KRX trading day."
          fi

      - name: Resolve approved KRX generation
        id: krx
        if: steps.market_day.outputs.run == 'true'
        uses: ./.github/actions/resolve-krx-generation
        with:
          token: ${{ secrets.KRX_PRIVATE_REPO_TOKEN }}
          expected-date: ${{ inputs.krx_expected_date || inputs.as_of || '' }}
          output-dir: ${{ runner.temp }}/krx-report-input

      - name: Sync latest main
        if: steps.market_day.outputs.run == 'true'
        run: |
          git pull --ff-only origin main

      - name: Run report tests
        if: steps.market_day.outputs.run == 'true'
        run: |
          python3 -m py_compile daily_report.py test_daily_report.py
          python3 -m unittest test_daily_report.py -v

      - name: Resolve report and derived generation
        id: inputs
        if: steps.market_day.outputs.run == 'true'
        env:
          REPORT_AS_OF: ${{ inputs.as_of || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from daily_report import resolve_report_trading_date
          from tools.derived_input_resolver import resolve_derived_input

          requested = os.environ.get("REPORT_AS_OF") or None
          if requested:
              from daily_report import compact_date
              as_of = compact_date(requested)
              derived = resolve_derived_input("data/monitoring-derived", as_of)
              print(f"Resolved explicit derived report date: {as_of}")
          else:
              result = resolve_report_trading_date()
              if result.get("status") != "READY":
                  raise SystemExit(result.get("reason", "TRADING_DATE_UNAVAILABLE"))
              as_of = result["tradingDate"]
              derived = resolve_derived_input("data/monitoring-derived", as_of)
              print(f"Resolved evidence report date: {as_of}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"as_of={as_of}\n")
              output.write(f"derived_dir={derived['runDir']}\n")
              output.write(f"derived_run_id={derived['runId']}\n")
          print(f"Resolved report trading date: {as_of}")
          print(f"Resolved derived run: {derived['runId']}")
          PY

      - name: Build daily report
        if: steps.market_day.outputs.run == 'true'
        run: |
          as_of='${{ steps.inputs.outputs.as_of }}'
          derived_dir='${{ steps.inputs.outputs.derived_dir }}'
          expected=${EXPECTED_KRX_TRADING_DATE:-}
          if [ -n "$expected" ] && [ "$as_of" != "$expected" ]; then
            echo "Resolved published trading date ${as_of} does not match KRX scheduled target ${expected}." >&2
            exit 1
          fi
          # The 23:00 job is JSON history only.  Current-observation
          # Markdown/HTML is produced by Refresh market data from the same
          # report contract and is never duplicated here.
          python3 daily_report.py --as-of "$as_of" --output-dir data/reports --json-only \
            --staging-input-dir '${{ steps.krx.outputs.krx_report_input_dir }}'
        env:
          REPORT_AS_OF: ${{ inputs.as_of || '' }}
          EXPECTED_KRX_TRADING_DATE: ${{ steps.market_day.outputs.expected_date }}

      - name: Validate daily report
        if: steps.market_day.outputs.run == 'true'
        id: validate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/reports/latest.json")
          x = json.loads(p.read_text(encoding="utf-8"))

          enabled = x["coverage"]["enabledStockCount"]
          quotes = x["coverage"]["quoteCount"]
          technicals = x["coverage"]["technicalCount"]
          states = x["coverage"]["stateCount"]
          research = x["coverage"]["researchStockCount"]
          missing = x["coverage"]["missingMarketStocks"]

          print("status:", x["status"])
          print("coverageStatus:", x["coverageStatus"])
          print("enabledStockCount:", enabled)
          print("quoteCount:", quotes)
          print("technicalCount:", technicals)
          print("stateCount:", states)
          print("researchStockCount:", research)
          print("missingMarketCount:", len(missing))

          alignment = x.get("dateAlignment") or {}
          print("dateAlignment:", alignment.get("status"))
          if x["status"] == "OK" and alignment.get("status") != "OK":
              raise SystemExit("Invalid OK date alignment")

          if research != enabled:
              raise SystemExit(
                  f"Research coverage mismatch: {research}/{enabled}"
              )

          if x["coverageStatus"] == "OK":
              if not (
                  quotes >= enabled
                  and technicals >= enabled
                  and states >= enabled
              ):
                  raise SystemExit("Invalid OK coverage status")
          elif x["coverageStatus"] == "INCOMPLETE_MARKET_COVERAGE":
              print("Market coverage incomplete; report will be published as DEGRADED.")
          elif x["coverageStatus"] == "STALE_MARKET_DATA":
              print("Market data is stale; report will be published as DEGRADED.")
          elif x["coverageStatus"] == "EMPTY_CONFIGURED_UNIVERSE":
              print("Configured Universe is empty; full-market evidence remains separate and report is PARTIAL.")
          else:
              raise SystemExit("Unknown market coverage status")
          PY

      - name: Commit daily report
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/reports/*.json
          mkdir -p data/krx/provenance
          cp "${{ steps.krx.outputs.krx_metadata_path }}" data/krx/provenance/daily-report.json
          git add data/krx/provenance/daily-report.json

          if git diff --cached --quiet; then
            echo "No daily report changes to commit."
            exit 0
          fi

          git commit -m "Update daily market report"
          echo "Daily report build succeeded; synchronizing its data commit."
          for attempt in 1 2 3; do
            echo "Push synchronization attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Data commit conflicts with newer main. No automatic conflict resolution or force push was attempted."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Daily report push succeeded."
              exit 0
            fi
            echo "Push was rejected because main advanced; retrying with latest main."
          done
          echo "::error::Daily report build succeeded, but push was rejected after 3 attempts."
          exit 1
