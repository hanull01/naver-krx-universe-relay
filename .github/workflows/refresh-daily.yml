name: Refresh daily candles

on:
  workflow_dispatch:
  schedule:
    # 15:40 KST Mon-Fri = 06:40 UTC Mon-Fri. This refresh updates history and
    # stores today's provisional row for the next business day's PRE close.
    - cron: "40 6 * * 1-5"

permissions:
  contents: write

concurrency:
  # Preserve the single main-branch generated-data writer policy.
  group: generated-data-write
  cancel-in-progress: false

jobs:
  refresh-daily:
    runs-on: ubuntu-latest
    # Daily requests are per-stock with four workers; leave room for a larger
    # Universe without allowing an unbounded job.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check KRX trading day
        id: market_day
        shell: bash
        run: |
          set +e
          python krx_market_day.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping daily candle collection (closed market or unverifiable KRX calendar)."
          fi
          exit 0

      - name: Test daily collector
        if: steps.market_day.outputs.run == 'true'
        run: |
          python -m py_compile relay.py test_relay.py
          python -m unittest test_relay.py -v

      - name: Sync latest main before collection
        if: steps.market_day.outputs.run == 'true'
        run: git pull --ff-only origin main

      - name: Collect daily candles
        id: collect
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          echo "Daily collection started at $(TZ=Asia/Seoul date --iso-8601=seconds)"
          python relay.py daily
          code=$?
          echo "Daily collection finished at $(TZ=Asia/Seoul date --iso-8601=seconds)"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit daily candles
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Slow Daily is the sole writer for these paths.
          git add data/daily data/daily-status.json
          if git diff --cached --quiet; then
            echo "No daily candle changes to commit"
          else
            git commit -m "Update daily candles"
            echo "Daily collection produced updated outputs; synchronizing its data commit."
            for attempt in 1 2 3; do
              echo "Push synchronization attempt ${attempt}/3"
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Daily candle commit conflicts with newer main. No automatic conflict resolution or force push was attempted."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Daily candle data push succeeded."
                exit 0
              fi
              echo "Push was rejected because main advanced; retrying with latest main."
            done
            echo "::error::Daily collection succeeded, but push was rejected after 3 attempts."
            exit 1
          fi

      - name: Fail after publishing daily error files
        if: steps.market_day.outputs.run == 'true' && steps.collect.outputs.exit_code != '0'
        run: |
          echo "Daily collector reported one or more failures."
          exit 1
