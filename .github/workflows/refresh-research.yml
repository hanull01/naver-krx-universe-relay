name: Refresh NAVER Research

on:
  workflow_dispatch:
  schedule:
    # 08:20, 12:20, 20:20 KST on weekdays
    - cron: '20 23 * * 0-4'  # 08:20 KST Mon-Fri
    - cron: '20 3 * * 1-5'   # 12:20 KST Mon-Fri
    - cron: '20 11 * * 1-5'  # 20:20 KST Mon-Fri

permissions:
  contents: write

concurrency:
  group: research-data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh recent research
        run: |
          python3 naver_research.py update \
            --lookback-days 14 \
            --sleep 0.30 \
            --output-dir data/research

      - name: Validate research data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/research")
          rows = []

          for p in sorted((root / "reports").glob("*.json")):
              rows.extend(
                  json.loads(p.read_text(encoding="utf-8"))["reports"]
              )

          nids = [str(x["nid"]) for x in rows]

          assert len(nids) == len(set(nids))
          assert all(
              isinstance(x.get("analysis"), dict)
              for x in rows
          )
          assert all("content" not in x for x in rows)

          print("reports:", len(rows))
          print("validation: OK")
          PY

      - name: Build research intelligence
        run: |
          python3 research_intelligence_batch.py \
            --as-of "$(TZ=Asia/Seoul date +%F)" \
            --recent-days 30 \
            --min-recent-reports 3 \
            --output-dir data/research/intelligence

      - name: Validate research intelligence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/research/intelligence")
          latest = json.loads(
              (root / "latest.json").read_text(encoding="utf-8")
          )

          enabled = latest["enabledStockCount"]

          assert latest["status"] == "OK"
          assert len(latest["stocks"]) == enabled
          assert len(list(root.glob("*.json"))) == enabled + 1

          assert all(
              not row["rankingEligible"]
              for row in latest["stocks"]
              if row["status"] in {
                  "NO_RESEARCH",
                  "NO_RECENT_RESEARCH",
                  "LOW_SAMPLE",
              }
          )

          print("enabled stocks:", enabled)
          print("status counts:", latest["statusCounts"])
          print(
              "ranking eligible:",
              latest["rankingEligibleCount"],
          )
          print("intelligence validation: OK")
          PY

      - name: Run tests
        run: python3 -m unittest discover -s . -p 'test_*.py'

      - name: Commit updates
        shell: bash
        run: |
          git add data/research

          if git diff --cached --quiet -- data/research; then
            echo "No research or intelligence changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git grep --cached -n '"content"[[:space:]]*:' -- data/research; then
            echo "Raw report content detected."
            exit 1
          fi

          git commit -m "Update NAVER research intelligence"
          echo "Research collection succeeded; synchronizing its data commit."
          for attempt in 1 2 3; do
            echo "Push synchronization attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Data commit conflicts with newer main. No automatic conflict resolution or force push was attempted."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Research data push succeeded."
              exit 0
            fi
            echo "Push was rejected because main advanced; retrying with latest main."
          done
          echo "::error::Research collection succeeded, but push was rejected after 3 attempts."
          exit 1
