name: Refresh NAVER Research

run-name: KRX report ${{ inputs.krx_generation_id || 'missing-generation' }} ${{ inputs.krx_expected_date || 'missing-date' }}

on:
  workflow_dispatch:
    inputs:
      krx_expected_date:
        description: Expected KRX generation trading date (YYYYMMDD)
        required: false
        type: string
      krx_ref:
        description: Immutable private KRX branch or commit SHA
        required: false
        default: codex/krx-private-sync
        type: string
      krx_generation_id:
        description: Expected immutable KRX generation ID
        required: false
        type: string
      publish:
        description: Publish research data; false performs validation only
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  # All generated-data commits share main, even when their output paths differ.
  group: generated-data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-qa.txt

      - name: Resolve approved KRX generation
        id: krx
        uses: ./.github/actions/resolve-krx-generation
        with:
          token: ${{ secrets.KRX_PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.krx_ref || 'codex/krx-private-sync' }}
          expected-date: ${{ inputs.krx_expected_date || '' }}
          generation-id: ${{ inputs.krx_generation_id || '' }}
          require-expected-date: false
          require-generation-id: false
          output-dir: ${{ runner.temp }}/krx-report-input

      - name: Sync latest main before collection
        run: |
          target_ref="${GITHUB_REF_NAME:-main}"
          git pull --ff-only origin "$target_ref"

      - name: Refresh recent research
        run: |
          python3 naver_research.py update \
            --lookback-days 14 \
            --sleep 0.30 \
            --output-dir data/research

      - name: Validate research data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/research")
          rows = []

          for p in sorted((root / "reports").glob("*.json")):
              rows.extend(
                  json.loads(p.read_text(encoding="utf-8"))["reports"]
              )

          nids = [str(x["nid"]) for x in rows]

          assert len(nids) == len(set(nids))
          assert all(
              isinstance(x.get("analysis"), dict)
              for x in rows
          )
          assert all("content" not in x for x in rows)

          print("reports:", len(rows))
          print("validation: OK")
          PY

      - name: Build research intelligence
        run: |
          python3 research_intelligence_batch.py \
            --as-of "$(TZ=Asia/Seoul date +%F)" \
            --recent-days 30 \
            --min-recent-reports 3 \
            --output-dir data/research/intelligence

      - name: Validate research intelligence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/research/intelligence")
          latest = json.loads(
              (root / "latest.json").read_text(encoding="utf-8")
          )

          enabled = latest["enabledStockCount"]

          assert latest["status"] == "OK"
          assert len(latest["stocks"]) == enabled
          assert len(list(root.glob("*.json"))) == enabled + 1

          assert all(
              not row["rankingEligible"]
              for row in latest["stocks"]
              if row["status"] in {
                  "NO_RESEARCH",
                  "NO_RECENT_RESEARCH",
                  "LOW_SAMPLE",
              }
          )

          print("enabled stocks:", enabled)
          print("status counts:", latest["statusCounts"])
          print(
              "ranking eligible:",
              latest["rankingEligibleCount"],
          )
          print("intelligence validation: OK")
          PY

      - name: Stage PC theme rankings
        id: pc_theme_rankings
        continue-on-error: true
        run: |
          python3 tools/collect_pc_theme_research.py \
            --output-dir data/research/theme-ranking

      - name: Report optional PC theme staging result
        if: always()
        run: |
          echo "PC theme staging outcome: ${{ steps.pc_theme_rankings.outcome }}"
          # This optional dataset never controls research/intelligence validity.

      - name: Stage verified theme membership
        id: theme_membership
        continue-on-error: true
        run: |
          python3 tools/collect_theme_membership.py \
            --output data/research/theme-membership/latest.json

      - name: Report theme membership result
        if: always()
        run: 'echo "Theme membership outcome: ${{ steps.theme_membership.outcome }}"'

      - name: Run tests
        run: python3 -m unittest discover -s . -p 'test_*.py'

      - name: Commit updates
        if: github.event_name != 'workflow_dispatch' || inputs.publish == true
        shell: bash
        run: |
          mkdir -p data/krx/provenance
          cp "${{ steps.krx.outputs.krx_metadata_path }}" data/krx/provenance/research.json
          git add data/research
          git add data/krx/provenance/research.json

          if git diff --cached --quiet -- data/research data/krx/provenance/research.json; then
            echo "No research or intelligence changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git grep --cached -n '"content"[[:space:]]*:' -- data/research; then
            echo "Raw report content detected."
            exit 1
          fi

          git commit -m "Update NAVER research intelligence"
          echo "Research collection succeeded; synchronizing its data commit."
          for attempt in 1 2 3; do
            echo "Push synchronization attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Data commit conflicts with newer main. No automatic conflict resolution or force push was attempted."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Research data push succeeded."
              exit 0
            fi
            echo "Push was rejected because main advanced; retrying with latest main."
          done
          echo "::error::Research collection succeeded, but push was rejected after 3 attempts."
          exit 1

      - name: Report NO_PUBLISH validation result
        if: github.event_name == 'workflow_dispatch' && inputs.publish == false
        run: |
          echo "NO_PUBLISH: validation completed; no commit, push, main publication, or provenance publication was performed."
